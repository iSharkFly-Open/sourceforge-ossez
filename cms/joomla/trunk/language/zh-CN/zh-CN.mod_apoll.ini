DESCAPOLL=This Module enhances the Apolls Component. It is used to display the configured Polls. You can select a specific Poll to display in the Poll Module.
MOD_APOLL=<em>mod_apoll</em>
POLL=Poll
VOTE=Vote
PROCESSING ...=正在处理 ....
TOTAL VOTES=总票数
PLEASE SELECT AN OPTION=请选择选项
VIEW DETAILS=查看结果
YOU HAVE ALREADY VOTED.=您已经投过票了。
PLEASE REGISTER TO VOTE=请注册后再投票。
ONLY ONE VOTE PER USER IS ALLOWED.=同一个用户只能投一次。
ONLY ONE VOTE PER USER IS ALLOWED.=同一个用户只能投一次。
ONLY ONE VOTE PER IP IS ALLOWED.=同一个 IP 地址只能投一次。
ONLY ONE VOTE EACH %U HOURS IS ALLOWED.=每 %u 小时内，只能投票一次。
THE VOTING FOR THIS POLL HAS NOT STARTED YET.=这个投票调查还未开始允许投票。 
IT WILL START ON:=这个投票调查将开始于： 
THE VOTING FOR THIS POLL HAS ENDED=当前投票已经结束了。
ON:=上：
READ THE RELATED ARTICLE >>=相关文章  >>


PARAMMODULEPOLL=选择希望显示的投票调查
SELECT POLL=选择投票调查
SHOW RANDOM POLL=随机显示投票调查
AJAX VOTE=Ajax 投票
AJAX VOTE DESC=When voting use ajax (refreshes only the module not the whole page)
SHOW POLL TITLE=显示投票调查标题
SHOW POLL TITLE DESC=在模块中显示投票调查
ONLY ONE COLOR=One color for bars
ONLY ONE COLOR DESC=If set to YES you must specify the color to be used for all bars below
BARS COLOR=Bars color
BARS COLOR DESC=Color of the bars that show the result (Active only if above is YES)
BARS BORDER COLOR=Bars border color
BARS BORDER COLOR DESC=Color of the borders around the bars
ONLY REGISTERED=只有注册用户才能投票
ONLY REGISTERED DESC=If YES only users who has logged in will be able to cast a vote
ONE VOTE PER USER=同一个用户只能投票一次
ONE VOTE PER USER DESC=If only registered users are allowed to vote, let them vote only once
ONE VOTE PER IP=同一个 IP 只能投票一次 
ONE VOTE PER IP DESC=If anyone is allowed to vote, record the ip and allow only one veto from ip.
IF VOTED=如果用户已投票了
IF VOTED DESC=What to show after the user has voted for this poll
SHOW RESULTS=显示结果
SHOW DISABLED OPTIONS=显示禁用选项
SHOW VIEW DETAILS=Show "view details" link
SHOW VIEW DETAILS DESC=显示投票调查详细结果的链接
SHOW REL ARTICLE=为文章显示链接
SHOW REL ARTICLE DESC=为文章显示链接
RELATED ARTICLE LINK=相关文章链接
RELATED ARTICLE LINK DESC=链接到相关文章
IN NEW WINDOW=在新窗口中打开文章
IN NEW WINDOW DESC=如果选择 YES，那么链接将会在新窗口中打开
SHOW TOTAL=显示投票数
SHOW TOTAL DESC=显示总投票数
SHOW MESSAGES=显示消息 
SHOW MESSAGES DESC=Show information messages like: The poll has ended, you have voted etc. 
SHOW DETAILED MESSAGES=显示详细信息 
SHOW DETAILED MESSAGES DESC=Show more details like: Why user is not allowed to vote, publish dates of the poll etc... Show messages parameter must be YES
MSG DATE FORMAT=日期格式
MSG DATE FORMAT DESC=详细信息中的日期格式 
PLEASE REGISTER TO VOTE=请注册后投票

