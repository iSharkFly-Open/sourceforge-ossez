#Pie options
PIE TRANSPARANCY=Pie transparancy
PIE TRANSPARANCY DESC=Set the transparancy of the pie animation, 0 means fully transparent
BACKGROUND COLOR=Background color #
BACKGROUND COLOR DESC =Color of the flash background. Hexademical value. INPUT EXAMPLE for white: ffffff
CIRCLE COLOR=Circle color #
CIRCLE COLOR DESC =Color of the pie border. Hexademical value. INPUT EXAMPLE: 505050
PIE WIDTH=Pie width
PIE WIDTH DESC=Width of the flash element. Can be set either in percents or in px. INPUT EXAMPLE: 100% or 400px
PIE HEIGHT=Pie height
PIE HEIGHT DESC=Height of the flash element. Value in pixels. INPUT EXAMPLE: 400
START ANGLE=Start angle
START ANGLE DESC=Start angle
RADIUS=Radis
RADIUS DESC=Radius of the pie
GRADIENT=Gradient
GRADIENT DESC=Gradient colors pie
SHOW LABELS=Show labels
SHOW LABELS DESC=Show labels
SHOW ZERO VOTES=Show options with no votes
SHOW ZERO VOTES DESC=Show options that have not received any votes yet
ANIMATION=Animation
ANIMATION DESC=Animate clicking on the slices
BOUNCE=Bounce
FADE=Fade
BOUNCE DINSTANCE=Bounce distance
BOUNCE DINSTANCE DESC=How far from the pie the slices can go
BACKGROUND IMAGE=Background image
BACKGROUND IMAGE DESC=Image that you want to put under the flash pie
LEFT=left
RIGHT=right
CENTER=center
TOP=top
BOTTOM=bottom
MIDDLE=middle
X POSITION=Image x position
X POSITION DESC=The horizontal align of the background image. Tip: Don't forget that you can edit your image to have a 20 pixel blank border around it so it is not 'squished' up against the edge of the chart. 
Y POSITION=Image y position
Y POSITION DESC=The vertical align of the background image. Tip: Don't forget that you can edit your image to have a 20 pixel blank border around it so it is not 'squished' up against the edge of the chart. 
FONT SIZE OF LABELS=Font size of labels
FONT SIZE LABELS DESC=Size of the font used for displaying the options
FONT COLOR OF LABELS=Font color of labels
FONT COLOR DESC=Color of the font used for displaying the options
OPTIONS LENGHT=Options text lenght
OPTIONS LENGHT DESC=Specify the lenght of the options text (number of charecters). This is needed because if your options text is too long it will make the pie smaller. Default is 30. All characters after that will not be shown. 

