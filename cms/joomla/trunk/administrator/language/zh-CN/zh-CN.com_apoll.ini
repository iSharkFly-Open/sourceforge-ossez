OPTIONS FONT SIZE DESC=The size of the font of the optins text in px
CHART WIDTH DESC=Chart width in px or %
HEIGHT OF BARS=Height of bars
HEIGHT OF BARS DESC=Height in bars in pixels
BARBORDER=Bar border
BARBORDER DESC=Bar border - for instance: 1px solid #cccccc or 3px dashed green
BGBARCOLOR #=Background bar color #
BGBARCOLOR DESC=Color of the background of the underlying bar
BGBARBORDER=Background bar border
BGBARBORDER DESC=Border of the background bar - for instance: 1px solid #cccccc or 3px dashed green

