<body id="install_on_the_same"><a name="install_on_the_same"><!-- --></a>


  <h1 class="topictitle1">Zen Cart 可以在同一主机上安装多次吗</h1>

  
  <div>
    <p>你可以在同一个主机上安装多个 Zen Cart 程序。出于安全考虑，在安装之前请备份已经安装过的程序和数据库。你应该为你新安装的的 Zen Cart 程序设置自己的目录，同时使用干净的数据库进行安装。</p>

    <div class="note"><span class="notetitle">注：</span> 不要将新安装的 Zen Cart 和已经安装的 Zen Cart 使用相同的数据库。你的数据库表有肯能被重写或者损坏。</div>

  </div>
