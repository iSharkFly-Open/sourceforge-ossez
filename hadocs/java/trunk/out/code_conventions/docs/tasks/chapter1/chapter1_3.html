  <h1 class="topictitle1">代码测试与维护</h1>

  
  <div>
    <div class="p"><ol>
        <li>单元测试要求至少达到语句覆盖。</li>

        <li>单元测试开始要跟踪每一条语句，并观察数据流及变量的变化。</li>

        <li>清理、整理或优化后的代码要经过审查及测试。</li>

        <li>代码版本升级要经过严格测试。 </li>

      </ol>
