  <h1 class="topictitle1">Hudson 测试驱动</h1>

  
  
  <div><p/>

    <p><a href="https://hudson.dev.java.net/hudson.jnlp" target="_blank">
        <img src="../../images/introduction_webstart.gif"/>
      </a>通过 Java Web Start 来为 Hudson 作为测试驱动来运行。成功运行后，通过地址 <a href="http://localhost:8080/" target="_blank">http://localhost:8080/</a> 进入控制台界面。</p>

    <p>任何你为 Hudson 做的修改将会被保存到  ~/.hudson 目录中。</p>

    <p>你修改的数据将会保留在本地，而不会随 Hudson 的重启而丢失。</p>
