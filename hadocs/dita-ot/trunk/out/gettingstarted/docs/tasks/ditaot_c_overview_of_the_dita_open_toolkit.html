<h1 class="topictitle1">Overview of the DITA Open Toolkit</h1>


<div><p>The DITA Open Toolkit is a reference implementation of
the OASIS DITA standard. The Toolkit transforms DITA content (maps
and topics) into deliverable formats, including XHTML, Eclipse Help,
HTML Help, JavaHelp, and PDF.</p>
