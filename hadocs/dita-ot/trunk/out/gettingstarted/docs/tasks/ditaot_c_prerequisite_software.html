  <h1 class="topictitle1">必备软件</h1>

  
  <div><p> DITA Open Toolkit 可以在 Windows 或 SUSE Linux 上安装。 在这之前请先安装 JDK。 </p>

    <div class="p">
 DITA Toolkit 已通过下面环境的测试：<dl>
        
          <dt class="dlterm">Java Development Kit (JDK)</dt>

          <dd>
            <ul>
              <li>IBM JDK 1.5, </li>

              <li>SUN JDK 1.5</li>

            </ul>

          </dd>

        
        
          <dt class="dlterm">操作系统</dt>

          <dd>
            <ul>
              <li>Microsoft Windows XP</li>

              <li>SUSE Linux Enterprise Server (SLES) 10</li>

            </ul>

          </dd>

        
      </dl>
</div>

    <p>
 DITA Toolkit 安装包中已经包含 Ant 1.7.1 and Saxon 6.5。  
 </p>
