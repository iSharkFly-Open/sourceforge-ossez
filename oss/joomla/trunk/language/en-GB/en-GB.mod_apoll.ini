DESCAPOLL=This Module enhances the Apolls Component. It is used to display the configured Polls. You can select a specific Poll to display in the Poll Module.
MOD_APOLL=<em>mod_apoll</em>
POLL=Poll
VOTE=Vote
PROCESSING ...=Processing ....
TOTAL VOTES=Total votes
PLEASE SELECT AN OPTION=Please select an option
VIEW DETAILS=View details
YOU HAVE ALREADY VOTED.=You have already voted.
PLEASE REGISTER TO VOTE=Please register to vote.
ONLY ONE VOTE PER USER IS ALLOWED.=Only one vote per user is allowed.
ONLY ONE VOTE PER USER IS ALLOWED.=Only one vote per user is allowed.
ONLY ONE VOTE PER IP IS ALLOWED.=Only one vote per IP is allowed.
ONLY ONE VOTE EACH %U HOURS IS ALLOWED.=Only one vote each %u hours is allowed.
THE VOTING FOR THIS POLL HAS NOT STARTED YET.=The voting for this poll has not started yet. 
IT WILL START ON:=It will start on: 
