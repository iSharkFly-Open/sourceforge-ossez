ON:=on:
READ THE RELATED ARTICLE >>=read the related article >>


PARAMMODULEPOLL=Select the Poll to be displayed
SELECT POLL=Select Poll
SHOW RANDOM POLL=Show random poll
AJAX VOTE=Ajax vote
AJAX VOTE DESC=When voting use ajax (refreshes only the module not the whole page)
SHOW POLL TITLE=Show poll title
SHOW POLL TITLE DESC=Show poll title in module
ONLY ONE COLOR=One color for bars
ONLY ONE COLOR DESC=If set to YES you must specify the color to be used for all bars below
BARS COLOR=Bars color
BARS COLOR DESC=Color of the bars that show the result (Active only if above is YES)
BARS BORDER COLOR=Bars border color
BARS BORDER COLOR DESC=Color of the borders around the bars
ONLY REGISTERED=Only registered can vote
ONLY REGISTERED DESC=If YES only users who has logged in will be able to cast a vote
ONE VOTE PER USER=One voter per user
ONE VOTE PER USER DESC=If only registered users are allowed to vote, let them vote only once
ONE VOTE PER IP=One vote per ip 
ONE VOTE PER IP DESC=If anyone is allowed to vote, record the ip and allow only one veto from ip.
IF VOTED=If user has voted
IF VOTED DESC=What to show after the user has voted for this poll
SHOW RESULTS=Show results
SHOW DISABLED OPTIONS=Show disabled options
SHOW VIEW DETAILS=Show "view details" link
SHOW VIEW DETAILS DESC=Show link to the detailed results for the poll
SHOW REL ARTICLE=Show link to article
SHOW REL ARTICLE DESC=Show link to article
RELATED ARTICLE LINK=Related article link
RELATED ARTICLE LINK DESC=Link to the related article
IN NEW WINDOW=Open article in new window
IN NEW WINDOW DESC=If yes, the link is opened in new window
SHOW TOTAL=Show number of votes
SHOW TOTAL DESC=Show total number of votes
SHOW MESSAGES=Show messages 
SHOW MESSAGES DESC=Show information messages like: The poll has ended, you have voted etc. 
SHOW DETAILED MESSAGES=Show detailed messages 
SHOW DETAILED MESSAGES DESC=Show more details like: Why user is not allowed to vote, publish dates of the poll etc... Show messages parameter must be YES
MSG DATE FORMAT=Date format
MSG DATE FORMAT DESC=Date format in detailed messages 
PLEASE REGISTER TO VOTE=Please register to vote

