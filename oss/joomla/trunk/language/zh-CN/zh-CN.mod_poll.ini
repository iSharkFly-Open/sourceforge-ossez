DESCPOLL=这是与投票调查组件配套的模块。它用来显示已设置好的投票调查。您可设置只显示一个指定的投票调查。
MOD_POLL=<em>投票模块</em>
POLL=投票调查
VOTE=投票
PARAMMODULEPOLL=要显示的投票调查
SELECT POLL=选择投票调查
