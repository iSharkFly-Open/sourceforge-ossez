A TEXT SEPARATOR=一个文本分隔符
MOD_BREADCRUMBS=<em>“面包屑型”路径模块</em>
BREADCRUMBS=面包屑（位置指引）
PARAMSHOWHOME=显示或隐藏路径中的首页元素（element）
PARAMSHOWLAST=显示或隐藏路径中的首页元素（element）
PARAMHOMETEXT=这些文字将作为首页入口entry而显示
PARAMSHOWCOMPONENT=在路径中显示或隐藏组件元素（element）
SHOW HOME=显示首页
TEXT FOR HOME ENTRY=首页入口（entry）的文字
SHOW COMPONENT=显示组件
TEXT SEPARATOR=文本分隔符
THIS MODULE DISPLAYS THE BREADCRUMBS=本模块显示“面包屑型”路径（位置指引）

