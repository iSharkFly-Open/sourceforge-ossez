PERMDELETETHESEITEMS=* 这将从数据库中<strong><font color="#FF0000">永久删除</font></strong>这些条目 *
RESTOREITEMS=* 这将<strong><font color="#FF0000">恢复</font></strong>这些条目，
DELETE=删除
DELETE ITEMS=永久删除条目
ITEM(S) SUCCESSFULLY DELETED=已成功删除%s条条目
ITEM(S) SUCCESSFULLY RESTORED=已成功恢复%s条条目
ITEMS BEING DELETED=条目正被删除
ITEMS BEING RESTORED=正准备恢复的条目
MENU=菜单
MENU ITEMS=菜单条目
NUMBER OF ITEMS=条目数
PARAMTRASH=这个组件管理回收站的功能。
PLEASE MAKE A SELECTION FROM THE LIST TO=请从列表中选择一个条目
PERMANENTLY DELETE=永久删除
RESTORE ITEMS=恢复条目
TIPWILLBERETURNED=这些条目将作为未发布的条目而恢复到原始位置 *
TRASH MANAGER=回收站管理
UNCATEGORIZED=未分类的
WARNRESTORE=您确定要恢复所列出的条目吗？
WARNWANTDELLISTEDITEMS=您确定要删除所列出的条目吗？<br />这将从数据库中<strong><font color="#FF0000">永久删除</font></strong>它们。
