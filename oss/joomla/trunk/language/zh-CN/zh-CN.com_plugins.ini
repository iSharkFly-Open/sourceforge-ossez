FOLDER=文件夹
PLUGIN=插件
PLUGIN DETAILS=插件说明
PLUGIN FILE=插件文件
PLUGIN MANAGER=插件管理
PLUGIN MUST HAVE A FILENAME=插件必须有文件名称
PLUGIN MUST HAVE A NAME=插件必须有名称
PLUGIN NAME=插件名称
PLUGIN PARAMETERS=插件参数
PUBLISH=允许
PUBLISH ITEM=启用插件
PUBLISHED=启用
NO PARAMETERS=没有参数值
SELECT A PLUGIN TO=选择一个插件来
SELECT TYPE=请选择类型
SITE=浏览本站
SITE PLUGIN=网站插件
SUCCESSFULLY SAVED CHANGES TO PLUGIN=已成功地保存对该插件的修改：%s
SUCCESSFULLY SAVED PLUGIN=成功地保存插件：%s
THERE ARE NO PARAMETERS FOR THIS ITEM=该项目没有可设置的参数
THIS PLUGIN CANNOT BE REORDERED=该插件无法被再定购
UNPUBLISH=禁用
UNPUBLISH ITEM=禁用插件
UNPUBLISHED=已禁用
