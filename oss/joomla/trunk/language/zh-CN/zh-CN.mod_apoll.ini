DESCAPOLL=这个模块为 Apolls 组件，被用来显示投票调查的配置。你可以在选择显示一个特定的投票调查
MOD_APOLL=<em>mod_apoll</em>
POLL=投票调查
VOTE=选票
PROCESSING ...=正在处理 ....
TOTAL VOTES=总票数
PLEASE SELECT AN OPTION=请选择选项
VIEW DETAILS=查看结果
YOU HAVE ALREADY VOTED.=您已经投过票了。
PLEASE REGISTER TO VOTE=请注册后再投票。
ONLY ONE VOTE PER USER IS ALLOWED.=同一个用户只能投一次。
ONLY ONE VOTE PER USER IS ALLOWED.=同一个用户只能投一次。
ONLY ONE VOTE PER IP IS ALLOWED.=同一个 IP 地址只能投一次。
ONLY ONE VOTE EACH %U HOURS IS ALLOWED.=每 %u 小时内，只能投票一次。
THE VOTING FOR THIS POLL HAS NOT STARTED YET.=这个投票调查还未开始允许投票。 
IT WILL START ON:=投票调查将开始于： 
THE VOTING FOR THIS POLL HAS ENDED=当前投票已经结束了。
ON:=上：
READ THE RELATED ARTICLE >>=相关文章  >>


PARAMMODULEPOLL=选择希望显示的投票调查
SELECT POLL=选择投票调查
SHOW RANDOM POLL=随机显示投票调查
AJAX VOTE=Ajax 投票
AJAX VOTE DESC=当使用 Ajax 投票时 (仅仅当前模块适用，不适用整个页面)
SHOW POLL TITLE=显示投票调查标题
SHOW POLL TITLE DESC=在模块中显示投票调查
ONLY ONE COLOR=显示条的颜色
ONLY ONE COLOR DESC=如果你选择 YES，你必须指定下面所有显示条的颜色
BARS COLOR=显示条颜色
BARS COLOR DESC=结果显示条边框的颜色 (选择  YES 时适用)
BARS BORDER COLOR=显示条边框颜色
BARS BORDER COLOR DESC=显示条边框的颜色
ONLY REGISTERED=只有注册用户才能投票
ONLY REGISTERED DESC=如果选择 YES，只有成功登录的注册用户才可以投票
ONE VOTE PER USER=同一个用户只能投票一次
ONE VOTE PER USER DESC=只有注册用户才可以投票，并且只能投票一次
ONE VOTE PER IP=同一个 IP 只能投票一次 
ONE VOTE PER IP DESC=如果任何人可以允许投票，记录中的 IP 只能被允许投票一次
IF VOTED=如果用户已投票了
IF VOTED DESC=用户已经投票后，应该显示什么
SHOW RESULTS=显示结果
SHOW DISABLED OPTIONS=显示禁用选项
SHOW VIEW DETAILS=Show "查看更多" 链接
SHOW VIEW DETAILS DESC=显示投票调查详细结果的链接
SHOW REL ARTICLE=为文章显示链接
SHOW REL ARTICLE DESC=为文章显示链接
RELATED ARTICLE LINK=相关文章链接
RELATED ARTICLE LINK DESC=链接到相关文章
IN NEW WINDOW=在新窗口中打开文章
IN NEW WINDOW DESC=如果选择 YES，那么链接将会在新窗口中打开
SHOW TOTAL=显示投票数
SHOW TOTAL DESC=显示总投票数
SHOW MESSAGES=显示消息 
SHOW MESSAGES DESC=显示如下信息：投票已经结束；你已经投票过了 
SHOW DETAILED MESSAGES=显示详细信息 
SHOW DETAILED MESSAGES DESC=显示更多详细信息：为什么用户不允许投票，发布日期等... 显示消息的参数必须选择是
MSG DATE FORMAT=日期格式
MSG DATE FORMAT DESC=详细信息中的日期格式 
PLEASE REGISTER TO VOTE=请注册后投票

