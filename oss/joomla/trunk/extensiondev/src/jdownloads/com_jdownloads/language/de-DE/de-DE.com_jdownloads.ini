JLIST_INSTALL_ABORT=FEHLER! Ein Update auf 1.5 ist nur von der Version 1.4 möglich! Die gefundenen Daten sind aber von einer älteren Version. Installieren Sie daher zuerst die Version 1.4 und wiederholen Sie dann das Update auf 1.5!

