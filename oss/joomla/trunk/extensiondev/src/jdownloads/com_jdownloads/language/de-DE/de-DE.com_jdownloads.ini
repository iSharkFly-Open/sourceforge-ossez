# add {sum_jcomments} in the line 218 on the end
# Please add also the placeholder {release} in JLIST_BACKEND_SETTINGS_TEMPLATES_DETAILS_DESC (after {file_title}) and in JLIST_BACKEND_SETTINGS_TEMPLATES_DETAILS_DEFAULT (after {file_title}).  

# Options for download waiting time (like rapidshare)
JLIST_BACKEND_SETTINGS_WAITING_HEADER=Optionen für Download Wartezeit
JLIST_BACKEND_SETTINGS_WAITING_TITLE=Wartezeit aktivieren
JLIST_BACKEND_SETTINGS_WAITING_DESC=Wenn ja, wird dem nicht registriertem Anwender ein Countdown in der Seite: Zusammenfassung angezeigt. Der Download ist erst dann möglich, wenn der Countdown beendet wurde.
JLIST_BACKEND_SETTINGS_WAITING_VALUE_TITLE=Startwert in Sekunden
JLIST_BACKEND_SETTINGS_WAITING_NOTE_TITLE=Hinweistext für den Anwender
JLIST_BACKEND_SETTINGS_WAITING_NOTE_DESC=Hier ist der Text für den Countdown. Dieser wird an der Position des Layout Platzhalters {url_download} angezeigt.
JLIST_BACKEND_SETTINGS_WAITING_NOTE_TEXT=Bitte warten! Sie können in %s Sekunde(n) die Datei downloaden.<br /><br />Sie müssen registriert sein, um die Datei direkt herunterladen zu können.

# new options for frontend upload form
JLIST_CONFIG_FEUPLOAD_SHORT_DESC_VIEW=Feld für Kurzbeschreibung anzeigen?
JLIST_CONFIG_FEUPLOAD_SHORT_DESC_DESC=Wenn aktiviert, muss das Feld vom Anwender ausgefüllt werden.
JLIST_CONFIG_FEUPLOAD_EXTERN_FILE_VIEW=Eingabefeld für externe Datei anzeigen?
JLIST_CONFIG_FEUPLOAD_EXTERN_FILE_DESC=Wenn das normale Feld zum Hochladen einer Datei deaktiviert wird (s. unten),muss dieses Feld verwendet werden. Es können auch beide Felder verwendet werden. 
JLIST_CONFIG_FEUPLOAD_UPLOAD_FILE_VIEW=Datei hochladen Feld anzeigen?
JLIST_CONFIG_FEUPLOAD_UPLOAD_FILE_DESC=Normalerweise wird dieses Feld zum Hochladen einer Datei auf den Server verwendet.
JLIST_FRONTEND_UPLOAD_EXTERN_FILE_TITEL=URL zur externen Datei:
JLIST_FRONTEND_UPLOAD_EXTERN_FILE_OR=oder alternativ
JLIST_FRONTEND_UPLOAD_URL_OK=Der Download wurde erfolgreich hinzugefügt!<br />Die Veröffentlichung muss aber eventuell noch genehmigt werden.

# new options for handling uploads
JLIST_CONFIG_UPLOAD_GENERAL_HEAD=Generelle Einstellungen
JLIST_CONFIG_UPLOAD_FILENAME_LOW_TITLE=Dateinamen ändern?
JLIST_CONFIG_UPLOAD_FILENAME_LOW_DESC=Wenn ja, wird der Dateiname in Kleinbuchstaben geändert. <b>Empfohlene Einstellung: JA</b>.
JLIST_CONFIG_UPLOAD_FILENAME_BLANK_TITLE=Leerstellen im Dateinamen ändern?
JLIST_CONFIG_UPLOAD_FILENAME_BLANK_DESC=Wenn ja, werden alle Leerstellen im Dateinamen durch Unterstriche ersetzt. <b>Empfohlene Einstellung: JA</b>.
JLIST_CONFIG_UPLOAD_FILENAME_SPECIAL_TITLE=Sonderzeichen ändern/entfernen im Dateinamen?
JLIST_CONFIG_UPLOAD_FILENAME_SPECIAL_DESC=Wenn ja, werden problematische Sonderzeichen im Dateinamen umgewandelt (sofern möglich) oder entfernt. <b>Empfohlene Einstellung: JA</b>.
JLIST_CONFIG_UPLOAD_IMAGE_FILENAME_NOTE=Hinweis: Alle Optionen oben, gelten auch für die Dateinamen von hochgeladenen Bildern. 

# new options for handling folder names
#JLIST_CONFIG_REMOVE_CYRILLIC_CHAR_TITLE=Change cyrillic characters in category title?
#JLIST_CONFIG_REMOVE_CYRILLIC_CHAR_DESC=If yes, all cyrillic chracters in category names are changed when you create a new category. jD create for every category a folder with the same name, but not all servers support cyrillic characters in the file system. <b>Recommended setting: YES</b>.

# report download link
JLIST_CONFIG_REPORT_FILE_TITLE=>Download melden< Link anzeigen?
JLIST_CONFIG_REPORT_FILE_DESC=Wenn ja, kann der Besucher über diesen Link dem Administrator eine Mitteilung senden.<br />Hinweis: hierfür muss der Platzhalter: <b>{report_link}</b> im Dateien- und/oder Details-Layout vorhanden sein.
JLIST_CONFIG_REPORT_FILE_LINK_TEXT=Download melden
JLIST_CONFIG_REPORT_FILE_MAIL_TITLE=E-Mail Adressen für die Meldung  
JLIST_CONFIG_REPORT_FILE_MAIL_DESC=E-Mail Adressen, an welche die Meldung über den Download gesendet werden soll. Mehrere Adressen mit einem Semikolon (;) trennen. 
JLIST_REPORT_FILE_MESSAGE_TITLE=Ein Download wurde gemeldet!    
JLIST_REPORT_FILE_MESSAGE_TEXT=Ein Benutzer hat folgenden Download gemeldet:<br />Titel: %1$s<br />Download-ID: %2$s<br /><br />Bitte prüfen Sie diesen Download!
JLIST_REPORT_FILE_MESSAGE_OK=Dem Administrator wurde eine Nachricht, mit der Bitte um Überprüfung des Downloads übermittelt.
JLIST_REPORT_FILE_MESSAGE_ERROR=Fehler - Es war nicht möglich die Nachricht zu versenden!     

# NEW OPTION FOR DOWNLOAD PIC BUTTON IN FILES LAYOUT
JLIST_BACKEND_SETTINGS_FILES_DOWNLOAD_BUTTON_TITLE=Alternativer Download Button
JLIST_BACKEND_SETTINGS_FILES_DOWNLOAD_BUTTON_DESC=Der hier ausgewählte Download Button wird nur in der Listenansicht der Downloads verwendet (Layout: Dateien). So kann hier beispielsweise ein kleinerer Button verwendet werden.

# NEW TITLE FOR COUNT DOWNLOADS IN BACKEND CATEGORIES LIST
JLIST_BACKEND_CATSLIST_COUNT=Anzahl<br />Dateien

# NEW OPTION FOR VIEW COUNT COMMENTS IN THE FILES LAYOUT
JLIST_BACKEND_SETTINGS_JCOMMENTS_VIEW_SUM_TITLE=Anzahl der Kommentare anzeigen?
JLIST_BACKEND_SETTINGS_JCOMMENTS_VIEW_SUM_DESC=Wenn ja, wird in der Listenansicht der Downloads, die Anzahl der Kommentare je Download angezeigt. Hierfür muss die obige Option aktiviert sein, sowie der Platzhalter <b>{sum_jcomments}</b> im >Dateien< Layout vorhanden sein.
JLIST_FRONTEND_JCOMMENTS_VIEW_SUM_TEXT=Kommentare: %s

# NEW FOR UPDATE CHECK
JLIST_BACKEND_UPDATE_CHECK_TITLE=Jetzt auf neue Version prüfen!

# NEW OPTION TO INSERT NEW FILES AT FIRST IN THE CATEGORY 
JLIST_BACKEND_SETTINGS_NEW_FILES_ORDER_FIRST_TITLE=Neue Downloads zuoberst einfügen?
JLIST_BACKEND_SETTINGS_NEW_FILES_ORDER_FIRST_DESC=Wenn ja, werden neu gespeicherte Downloads am Anfang der entsprechenden Kategorie im Backend eingefügt. Wenn nein, am Ende der entsprechenden Kategorie.

# NEW OPTIONS FOR FRONTEND VIEW
JLIST_BACKEND_SETTINGS_FRONTEND_FOOTER_TEXT_TITLE=Text in der Fußzeile 
JLIST_BACKEND_SETTINGS_FRONTEND_FOOTER_TEXT_DESC=Optionaler Text der am Fußende im Frontend angezeigt wird.<br /><br />Es können CSS-Klassen, HTML-Code sowie beliebiger Text eingefügt werden. Auch der Platzhalter {google_adsense} kann hier verwendet werden.
JLIST_BACKEND_SETTINGS_FRONTEND_BACK_BUTTON=Anzeige des >Zurück< Buttons?
JLIST_BACKEND_SETTINGS_FRONTEND_BACK_BUTTON_DESC=Wenn ja, wird am Seitenende der Anzeige im Frontend ein Button angezeigt, mit der zur zuvor angezeigten Seite navigiert werden kann.

# ----------- added in 1.5.2 RC2 ------------------

# NEW FOR EDIT CAT_DIR FIELD
# Note for the translater: please change the text from: JLIST_BACKEND_CATSEDIT_CAT_TITLE_DESC  (line 680) to: '=Category identification. Please use not single or double quotes for the category title.' an delete the rest!
JLIST_EDIT_CAT_DIR_TITLE=Verzeichnisname für diese Kategorie:
JLIST_EDIT_CAT_DIR_TITLE_DESC1=Für jede Kategorie wird automatisch ein Verzeichnis erstellt. Der Name hierfür wird aus dem Kategorie Titel generiert. Dieses ist aber nur möglich, wenn lediglich <b>alphanumerische Zeichen des lateinischen Alphabets (sowie kyrillische Zeichen)</b> verwendet werden. Sollen chinesische/japanische/arabische Zeichen (Arabic/Kanji/Jewish) für den Kategorie Titel verwendet werden, so muss zuvor die Option für die automatische Erstellung des Verzeichnisnamens in der Konfiguration deaktiviert werden.
JLIST_EDIT_CAT_DIR_TITLE_DESC2=Für jede Kategorie wird ein Verzeichnis erstellt. Hierfür dürfen nur <b>alphanumerische Zeichen des lateinischen Alphabets</b> verwendet werden. Alle anderen Zeichen werden automatisch entfernt. 
JLIST_BACKEND_CATSEDIT_ERROR_CAT_DIR_TEXT=Es muss ein Verzeichnisname für diese Kategorie eingegeben werden!

# new option for auto creation category directory name
JLIST_CONFIG_CREATE_AUTO_DIR_NAME_TITLE=Verzeichnisnamen für die Kategorien automatisch erstellen?
JLIST_CONFIG_CREATE_AUTO_DIR_NAME_DESC=Für jede Kategorie wird im Download Ordner eine Verzeichnis erstellt. Wenn dies Option aktiviert ist, wird ein Verzeichnisname anhand des Kategorie Titels automatisch generiert. Dieses ist aber nur möglich, wenn ausschließlich alphanumerische Zeichen des lateinischen Alphabets verwendet werden (zusätzlich können Zeichen des Kyrillischen Alphabets verwendet werden). Sollen aber chinesische/japanische/arabische Zeichen (Arabic/Kanji/Jewish) für den Kategorie Titel verwendet werden, so muss diese Option deaktiviert werden. Anschließend kann der Verzeichnisname manuell eingetragen werden. <b>Vorsicht: Eine spätere, erneute Aktivierung kann unerwartete Ergebnisse hervorbringen und wird nicht empfohlen.</b>

# new option to reset all downloads counter to zero
JLIST_BACKEND_SETTINGS_RESET_COUNTER_TITEL=Alle Download Zähler zurückstellen?
JLIST_BACKEND_SETTINGS_RESET_COUNTER_DESC=Sollen alle Download Zähler auf Null gesetzt werden, so aktivieren Sie diese Option und speichern Sie dann die Konfiguration. Vorsicht: Dies kann nicht rückgängig gemacht werden!
JLIST_BACKEND_SETTINGS_RESET_COUNTER_MSG=Alle Download Zähler wurden auf 0 gesetzt!

# view report link only for regged users
JLIST_CONFIG_REPORT_FILE_REGGED_TITLE=Link nur registrierten Besuchern anzeigen?
JLIST_CONFIG_REPORT_FILE_REGGED_DESC=Wenn ja, wird der >Download melden< Link nur registrierten Besuchern angezeigt. Empfohlene Einstellung: Ja.

# FOLDER NAMES FOR THE SAMPLE DATA
# ************* By translation - make sure that her you can only use latin characters - nothing else !!!!  
JLIST_SAMPLE_DATA_CAT_FOLDER_ROOT=Beispiel Kategorie
JLIST_SAMPLE_DATA_CAT_FOLDER_SUB=Beispiel Unterkategorie

