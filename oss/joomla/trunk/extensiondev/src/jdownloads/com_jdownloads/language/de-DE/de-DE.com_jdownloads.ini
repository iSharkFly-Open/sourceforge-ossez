JLIST_BACKEND_SETTINGS_TEMPLATES_HEAD_INFO2=<br /><b><u>Erklärung zu den Layouts</u></b><br /><b>Kategorien: </b>Im Kategorie Layout wird die Darstellung der Kategorien sowie der Elemente für die Verwendung der Checkboxen ober- und unterhalb der Downloadliste festgelegt.<br /><b>Dateien: </b>Hier wird die Darstellung der Downloadliste unterhalb der Kategorien festgelegt.<br /><b>Download-Details: </b>Hier wird die Darstellung eines Downloads in der Detailansicht festgelegt.<br /><b>Zusammenfassung: </b>Hier wird die Darstellung der Seite festgelegt, von der der eigentlich Download startet und dem Anwender eine Übersicht der aktivierten Downloads angezeigt wird. 

# ANTI_LEECH_CONFIG
JLIST_BACKEND_SETTINGS_ANTILEECH_TITLE=Download Ordner schützen?
