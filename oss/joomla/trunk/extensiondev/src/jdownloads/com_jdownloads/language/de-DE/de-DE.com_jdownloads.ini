# NEW OPTION AUTOPUBLISH NEW FOUNDED FILES
JLIST_BACKEND_SETTINGS_DOWNLOADS_AUTOPUBLISH_TITLE=Downloads automatisch veröffentlichen?
JLIST_BACKEND_SETTINGS_DOWNLOADS_AUTOPUBLISH_DESC=Wenn Ja, werden neu gefundene Dateien sofort veröffentlicht. Vorrausgesetzt, die Option zur Überwachung der Downloads oben ist aktiviert.<br /><b>Standard Einstellung: Nein.</b>

# NEW OPTION  FOR AUTODETECT ALL FILES
