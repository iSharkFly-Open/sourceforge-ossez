# error message when file allready exist 
JLIST_FRONTEND_UPLOAD_ERROR_FILE_EXISTS=Eine Datei mit diesem Namen existiert bereits im Verzeichnis. Bitte ändern Sie den Dateinamen!
# Install error - tables not found in DB
JLIST_INSTALL_ERROR_NO_TABLES=FEHLER: jDownloads Datenbank Tabellen nicht gefunden! Deinstalliere jDownloads und kontakte deinen Hoster (Tabellen können nicht erstellt werden).

#******************************************** ADDED for jD v.1.5.1 ***********************************************

# Added in svn 685 for basic PAD file support
# This functionality is in the moment not official and only experimental
JLIST_BACKEND_SETTINGS_PAD_TAB_TITLE=PAD Datei
JLIST_BACKEND_SETTINGS_PAD_HEAD_TITLE=Konfiguration für PAD Datei Unterstützung
JLIST_BACKEND_SETTINGS_PAD_INFO_TEXT=<b>Was ist PAD?</b><br />PAD (Portable Application Description) ist das standardisierte Format zur Weitergabe von Hersteller- und Programm-Informationen von Softwareprodukten.  Weitere Informationen sind hier zu finden: <a href="http://www.ograhl.com/de/deupad/index.php" target="_blank">www.ograhl.com</a>.
JLIST_BACKEND_SETTINGS_PAD_ACTIVATE_TITLE=PAD aktivieren?
JLIST_BACKEND_SETTINGS_PAD_ACTIVATE_DESC=Wenn aktiviert, kann bei der Bearbeitung der Downloads eine PAD XML-Datei hochgeladen werden. Die Daten der Datei werden dann automatisch in die Download Datenfelder übertragen.
JLIST_BACKEND_SETTINGS_PAD_FOLDER_TITLE=Upload Verzeichnis für PAD Dateien
JLIST_BACKEND_SETTINGS_PAD_FOLDER_DESC=Verzeichnis in welches die PAD Dateien hochgeladen werden. Dieses muss im Joomla Hauptverzeichnis liegen. Wenn es noch nicht existiert, wird es beim Speichern der Konfiguration erstellt. Das Verzeichnis muss beschreibbar sein!
JLIST_BACKEND_SETTINGS_PAD_LANGUAGE_TITLE=Sprache Voreinstellung
JLIST_BACKEND_SETTINGS_PAD_LANGUAGE_DESC=Geben Sie hier die gewünschte Sprache an (mit englischer Bezeichnung). Diese gilt als Vorgabe für spezielle mehrsprachige Datenfelder der PAD Datei (z.B. Beschreibung, Währung).
JLIST_BACKEND_SETTINGS_PAD_FOLDER_CREATED= - PAD Verzeichnis erfolgreich erstellt!
JLIST_BACKEND_SETTINGS_PAD_FOLDER_NOT_CREATED= - PAD Verzeichnis konnte nicht erstellt werden! Erstellen Sie es manuell!

JLIST_BACKEND_FILE_EDIT_PAD_TAB_TITLE=PAD Datei
JLIST_BACKEND_FILE_EDIT_PAD_HEAD=PAD Datei für Datenübernahme verwenden 
JLIST_BACKEND_FILE_EDIT_PAD_FILE_TITLE=PAD Datei hochladen:
JLIST_BACKEND_FILE_EDIT_PAD_FILE_DESC=Hier kann eine PAD Datei hochgeladen werden. Mit den Daten der Datei werden dann die Download Datenfelder gespeichert. Der Dateiname der PAD XML-Datei muss die selbe Bezeichnung tragen wie die zugewiesene Download-Datei (ohne Dateierweiterung).<br /><b>Hinweis:</b> Gleichlautende XML-Dateinamen werden vor dem hochladen gelöscht.
JLIST_BACKEND_FILE_EDIT_SAVE_MOVEPADFILE_ERROR= - Fehler: PAD-Datei konnte nicht verschoben werden!
JLIST_BACKEND_FILE_EDIT_LOAD_PADFILE_ERROR= - Fehler: PAD-Datei konnte nicht gelesen werden!
JLIST_BACKEND_FILE_EDIT_SAVE_WITH_PAD_INFO= - PAD Daten erfolgreich übernommen!
JLIST_BACKEND_FILE_EDIT_PAD_FOLDER_STATE=PAD Upload Verzeichnis 
JLIST_BACKEND_FILE_EDIT_PAD_FOLDER_STATE_DESC=Hier ist der Status des PAD Upload Verzeichnisses zu sehen. Existiert es noch nicht, verwenden Sie ein FTP Programm dafür. Ist es nicht beschreibbar, ändern Sie die Zugriffsrechte mit einem FTP-Programm (CHMOD 0777).
JLIST_BACKEND_FILE_EDIT_PAD_ASSIGN_PAD_TITLE=Daten neu einlesen?
JLIST_BACKEND_FILE_EDIT_PAD_ASSIGN_PAD_DESC=Eine PAD-Datei existiert bereits für diesen Download. Wenn diese erneut eingelesen werden soll, klicken Sie auf den Button. 
JLIST_BACKEND_FILE_EDIT_PAD_FOLDER_NOT_EXISTS=Fehler: Verzeichnis existiert nicht!

JLIST_BACKEND_SETTINGS_TABTEXT_SPECIALS=Spezielles
# Google AdSense integration
JLIST_BACKEND_SETTINGS_ADSENSE_TITLE=Google AdSense optionen
JLIST_BACKEND_SETTINGS_ADSENSE_ACTIVATE_TITLE=Google AdSense Code aktivieren 
JLIST_BACKEND_SETTINGS_ADSENSE_ACTIVATE_DESC=Wenn ja, wird an der Position des Layout Platzhalters <b>{google_adsense}</b> der untenstehendem Code eingefügt. Der Platzhalter kann in allen Layout Typen verwendet werden. 
JLIST_BACKEND_SETTINGS_ADSENSE_CODE_TITLE=Google AdSense Code 
JLIST_BACKEND_SETTINGS_ADSENSE_CODE_DESC=Fügen Sie hier den von Google AdSense erstellten Code ein. 

