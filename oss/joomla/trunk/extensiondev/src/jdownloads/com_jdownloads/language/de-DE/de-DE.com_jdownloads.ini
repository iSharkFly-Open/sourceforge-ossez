JLIST_BACKEND_SETTINGS_HOT_DESC=Geben Sie hier die Anzahl an Downloads an, ab der ein Download als "HOT" (beliebt) gelten soll. Hinter dem Download-Titel wird dann das unten angegebene Symbol angezeigt. Bei 0 wird kein Symbol angezeigt.
