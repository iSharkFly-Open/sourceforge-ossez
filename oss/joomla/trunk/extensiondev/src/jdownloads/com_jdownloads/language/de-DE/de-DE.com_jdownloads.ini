JLIST_BACKEND_FILESEDIT_INFO_FIELDS_DESC=Die nebenstehenden Felder dienen lediglich der Information und halten fest, wer und wann die Daten erfasst oder zuletzt geändert hat.

JLIST_BACKEND_SETTINGS_FRONTEND_CATLISTBOX_ACTIVE=Kategorie Listbox im Header anzeigen?
JLIST_BACKEND_SETTINGS_FRONTEND_CATLISTBOX_DESC=Wenn ja, wird im Header aussen rechts eine Listbox mit allen veröffentlichten Kategorien angezeigt zu dem der Anwender laut seinem Status Zugriff hat. Hierüber kann er dann gezielt sofort zur gewünschten Kategorie/Unterkategorie gelangen.

