# View images seetings
JLIST_BACKEND_SETTINGS_FRONTEND_SHOW_MINIPICS=Sollen die Info-Symbole angezeigt werden?
JLIST_BACKEND_SETTINGS_FRONTEND_SHOW_MINIPICS_DESC=Wenn aktiviert, wird in der Liste der Download-Dateien neben den Daten (Lizenz, Autor, Website, System, Sprache, Datum und Download-Link) ein Symbol angezeigt. Bei Deaktivierung sollte über das Datei-Layout entsprechende Texthinweise vor den jeweiligen Patzhaltern eingefügt werden.

JLIST_BACKEND_SETTINGS_FRONTEND_MINIPICS_SIZE=Grösse der Info-Symbole in Pixel
JLIST_BACKEND_SETTINGS_FRONTEND_MINIPICS_SIZE_DESC=Grösse in der die Info-Symbole angezeigt werden sollen. Standard: 20

JLIST_BACKEND_SETTINGS_FRONTEND_CATPICS_SIZE=Grösse der Kategorie Symbole in Pixel
JLIST_BACKEND_SETTINGS_FRONTEND_CATPICS_SIZE_DESC=Grösse in der die Kategorie Symbole angezeigt werden sollen. Es können auch eigene Symbole verwendet werden, laden Sie hierzu einfach die Symbole über ein FTP-Programm in das Unterverzeichnis: /catimages. Die Symbole stehen dann automatisch zur Auswahl. Standard: 48

JLIST_BACKEND_SETTINGS_FRONTEND_FILEPICS_SIZE=Grösse der Datei Symbole in Pixel
JLIST_BACKEND_SETTINGS_FRONTEND_FILEPICS_SIZE_DESC=Grösse in der die Datei Symbole angezeigt werden sollen. Es können auch eigene Symbole verwendet werden, laden Sie hierzu einfach die Symbole über ein FTP-Programm in das Unterverzeichnis: /fileimages. Die Symbole stehen dann automatisch zur Auswahl. Standard: 32

# View backend security settings
JLIST_BACKEND_SETTINGS_MAIL_SECURITY_DESC=Wenn JA, werden die E-Mail Adressen nicht im Klartext angezeigt um das auslesen durch Spambots zu erschweren. Beachten Sie, dass Besucher, welche die Javascript-Option in ihrem Browser deaktiviert haben, der Link dann nicht angezeigt wird. Empfohlene Einstellung: JA.
JLIST_BACKEND_SETTINGS_MAIL_SECURITY_TITEL=E-Mail Adresse verschleiern:

# View backend Config settings
JLIST_BACKEND_SETTINGS_EDITOR_LAYOUTS=WYSIWYG-Editor bei Layouts verwenden
JLIST_BACKEND_SETTINGS_EDITOR_LAYOUTS_DESC=Wenn aktiviert, wird beim bearbeiten der Layouts der aktivierte Wysiwyg-Editor verwendet. Ansonsten ein reines Textfeld. Empfohlene Einstellung: Nein.
JLIST_BACKEND_SETTINGS_EDITOR_FILES=WYSIWYG-Editor bei Downloads verwenden
JLIST_BACKEND_SETTINGS_EDITOR_FILES_DESC=Wenn aktiviert, wird beim bearbeiten der Downloads der aktivierte Wysiwyg-Editor verwendet. Ansonsten ein reines Textfeld.
JLIST_BACKEND_SETTINGS_EDITOR_CATS=WYSIWYG-Editor bei Kategorien verwenden
JLIST_BACKEND_SETTINGS_EDITOR_CATS_DESC=Wenn aktiviert, wird beim bearbeiten der Kategorien der aktivierte Wysiwyg-Editor verwendet. Ansonsten ein reines Textfeld.
JLIST_BACKEND_SETTINGS_EDITOR_LICENSES=WYSIWYG-Editor bei Lizenzen verwenden
JLIST_BACKEND_SETTINGS_EDITOR_LICENSES_DESC=Wenn aktiviert, wird beim bearbeiten der Lizenzen der aktivierte Wysiwyg-Editor verwendet. Ansonsten ein reines Textfeld.

JLIST_BACKEND_SETTINGS_FILE_SYSTEM_LIST=Auswahlliste für Downloads Feld: "System" bearbeiten
JLIST_BACKEND_SETTINGS_FILE_SYSTEM_LIST_DESC=Hier können die Inhalte dieses Feldes bearbeitet werden. Zwischen jedem Wert muss ein Komma (,) stehen.<br /></br><b>Wichtiger Hinweis:</b> sollten bereits Downloads mit dieser Liste gespeichert worden sein, so wirken sich Änderungen hier auf diese Downloads aus. Beispiel: Downloads gespeichert mit System = "Joomla 1.5". Wird an dieser Position der Liste nun ein anderer Wert eingesetzt (z.B. Windows Vista), so steht diese Angabe dann automatisch in den betreffenden Downloads als System! Empfohlen wird daher neue Werte an das Ende der Liste zu setzen.

JLIST_BACKEND_SETTINGS_FILE_LANGUAGE_LIST=Auswahlliste für Downloads Feld: "Sprache" bearbeiten
JLIST_BACKEND_SETTINGS_FILE_LANGUAGE_LIST_DESC=Hier können die Inhalte dieses Feldes bearbeitet werden. Zwischen jedem Wert muss ein Komma (,) stehen.<br /></br><b>Wichtiger Hinweis:</b> sollten bereits Downloads mit dieser Liste gespeichert worden sein, so wirken sich Änderungen hier auf diese Downloads aus. Beispiel: Download gespeichert mit Sprache = "Deutsch". Wird an dieser Position der Liste nun ein anderer Wert eingesetzt (z.B. Dänisch), so steht diese Angabe dann automatisch in den betreffenden Downloads als Spache! Empfohlen wird daher neue Werte an das Ende der Liste zu setzen.

JLIST_BACKEND_SETTINGS_FRONTEND_ZIPFILE_PREFIX_TEXT=Vorangestellter Text bei Zipdateien
JLIST_BACKEND_SETTINGS_FRONTEND_ZIPFILE_PREFIX_DESC=Werden mehrere Dateien zum Download ausgewählt, so werden diese automatisch in eine temporäre Zipdatei gepackt und dem Besucher als eine einzige Downloaddatei zur Verfügung gestellt. Der Dateiname der Zipdatei wird dabei aus dem links angegebenem Text (prefix) und einer Zufallsszahl gebildet.

# Templates Config Backend
JLIST_BACKEND_SETTINGS_TEMPLATES_HEAD=<b>Die Layouts bestimmen die Darstellung der Inhalte im Frontend.</b>
JLIST_BACKEND_SETTINGS_TEMPLATES_HEAD_INFO=<br />Bei der Installation werden bereits einige Standard-Layouts mitgeliefert. Diese können bei Bedarf angepasst, oder auch komplett neue Layouts erstellt werden. Um dies zu vereinfachen kann in der Konfiguration festgelegt werden, ob für die Bearbeitung ein WYSIWYG-Editor, oder ein einfaches Textfeld verwendet werden soll.<br /><br />Sollte die Ausgabe der Komponente im Frontend nach vorgenommenen Änderungen an den <b>Standard-Layouts</b> nicht mehr einwandfrei funktionieren, so kann jederzeit der <b>Originalinhalt</b> (gemeint ist der Zustand nach der Installation) wieder hergestellt werden. Entfernen Sie hierzu im entsprechenden Standard-Layout Eingabefeld <b>alle Texte</b> und klicken Sie dann auf <b>Speichern</b>. Die Seite wird dann mit dem Originalinhalt geladen aber noch nicht gespeichert. <b>Vorsicht:</b> vorgenommene Änderungen gehen hierbei verloren.<br /><br />Hinweis: in den Layouts werden etliche Platzhalter (z.B. <font color=darkred>{files}</font>) verwendet. An der Stelle der Platzhalter wird bei der Generierung der eigentlichen Webseite der entsprechende Inhalt eingefügt.<br />

JLIST_BACKEND_SETTINGS_TEMPLATES_CATS=Layout: Kategorien
JLIST_BACKEND_SETTINGS_TEMPLATES_CATS_DESC=Dies ist die Darstellung der <b>Kategorien</b> im Frontend. Wenn Sie in der Globalen Konfiguration die Option: <b>Startseite mit Kategorienübersicht verwenden</b> aktiviert haben, so werden die Platzhalter {files} und {checkbox_top} nur bei der Darstellung der einzelnen Kategorie berücksichtigt.<br /><br />Die <font color=red>{files} {form_hidden} {form_button} {checkbox_top}</font> Platzhalter sollten <font color=red>NICHT</font> aus dem Code entfernt werden! Entfernen Sie den Platzhalter {checkbox_top} nur dann aus dem Code, wenn im Dateien-Layout der Platzhalter {url_download} verwendet wird. Der {files} Tag wird ersetzt mit den Daten die im Layout: "Dateien" angegeben wurden.<br /><br />Verfügbare Platzhalter:<br />{cat_title} {cat_description} {cat_pic} {files} {checkbox_top} {sum_subcats} {sum_files_cat}
JLIST_BACKEND_SETTINGS_TEMPLATES_CATS_INFO_TITLE=<b>Informationen zum Kategorien Layout:</b>
JLIST_BACKEND_SETTINGS_TEMPLATES_CATS_INFO_TEXT=<p>Hier sehen Sie ein grafisches Beispiel für die Darstellung der Kategorie-Beschreibung im Frontend. Der dunkelrote Rahmen, markiert den Bereich dessen Darstellung Sie hier ändern können.</p>

JLIST_BACKEND_SETTINGS_TEMPLATES_FILES=Layout: Dateien
JLIST_BACKEND_SETTINGS_TEMPLATES_FILES_DESC=Dies ist die Darstellung der <b>Dateiliste</b> im Frontend unterhalb der Kategoriebeschreibung.<br /><br />Verfügbare Platzhalter:<br />{checkbox_list} {cat_id} {file_id} {file_title} {file_name} {release} {pic_is_new} {pic_is_hot} {pic_is_updated} {url_download} {thumbnail} {description} {link_to_details} {file_pic} {price_title} {price_value} {license_title} {license_text} {language_title} {language_text} {filesize_title} {filesize_value} {system_title} {system_text} {author_title} {author_text} {author_url_title} {author_url_text} {created_date_title} {created_date_value} {hits_title} {hits_value} {created_by_title} {created_by_value} {modified_by_title} {modified_by_value} {modified_date_title} {modified_date_value} {mirror_1} {mirror_2} {mp3_player} {mp3_id3_tag} {google_adsense} {report_link} {sum_jcomments}
JLIST_BACKEND_SETTINGS_TEMPLATES_FILES_INFO_TITLE=<b>Informationen zum Dateien Layout:</b>
JLIST_BACKEND_SETTINGS_TEMPLATES_FILES_INFO_TEXT=<p>Hier sehen Sie ein grafisches Beispiel für die Darstellung der Dateiliste im Frontend. Der dunkelrote Rahmen, markiert den Bereich dessen Darstellung Sie hier ändern können.</p>

JLIST_BACKEND_SETTINGS_TEMPLATES_FINAL=Layout: Zusammenfassung / Download starten
JLIST_BACKEND_SETTINGS_TEMPLATES_FINAL_DESC=Dies ist die Darstellung der <b>Zusammenfassung</b> im Frontend. Es wird dem Besucher vor dem Download eine Aufstellung der ausgewählten Dateien präsentiert.<br />Hier können Sie die Darstellung der Seite anpassen. Es können CSS-Klassen, HTML-Code sowie beliebiger Text eingefügt werden.<br /><br />Die Platzhalter <font color=red>{download_liste} und {download_link}</font> sollte <font color=red>NICHT</font> aus dem Code entfernt werden!<br /><br />Verfügbare Platzhalter:<br />{summary_pic} {title_text} {download_liste} {license_note} {download_link} {external_download_info}  
JLIST_BACKEND_SETTINGS_TEMPLATES_FINAL_INFO_TITLE=<b>Informationen zum Layout: Zusammenfassung</b>

JLIST_BACKEND_SETTINGS_TEMPLATES_FINAL_INFO_TEXT=<p>Hier sehen Sie ein grafisches Beispiel für die Darstellung dieser Seite im Frontend. Der dunkelrote Rahmen, markiert den Bereich dessen Darstellung Sie hier ändern können.</p>

JLIST_BACKEND_SETTINGS_TEMPLATES_MAIL=Layout: E-Mail
JLIST_BACKEND_SETTINGS_TEMPLATES_MAIL_DESC=Hier können Sie die Darstellung der <b>E-Mail</b> festlegen, die (sofern aktiviert) nach jedem Download an die in der Konfiguration festgelegte Adresse versendet wird. Es kann HTML-Code sowie beliebiger Text eingefügt werden.<br /><br />Verfügbare Platzhalter:<br />{file_list} {ip_address} {date_time} {user_name} {user_group}

