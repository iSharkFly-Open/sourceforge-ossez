JLIST_BACKEND_TEMPEDIT_CHECKBOX_DESC=Wenn ja, wird bei der Ausgabe die Checkbox-Kopfzeile und der "Download" Button  angezeigt. Ausserdem muss dann der Platzhalter <b>{checkbox_list}</b> im Layout eingefügt werden. Wenn nein, muss stattdessen der Platzhalter <b>{url_download}</b> im Layout eingefügt/verwendet werden. 
JLIST_BACKEND_TEMPEDIT_SYMBOLE_TITLE=Mini-Symbole einfügen?
JLIST_BACKEND_TEMPEDIT_SYMBOLE_DESC=Wenn ja, werden vor den entsprechenden Platzhaltern Mini-Symbole eingefügt. Die Größe der Symbole kann in der Konfiguration eingestellt werden. Wenn deaktiviert, müssen entsprechende Textbezeichner vor den Platzhaltern eingesetzt werden. 

