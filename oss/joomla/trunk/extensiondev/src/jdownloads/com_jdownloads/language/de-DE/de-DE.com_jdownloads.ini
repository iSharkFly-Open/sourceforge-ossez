JLIST_BACKEND_TEMPEDIT_CATTITLE=Kategorien Layout bearbeiten
JLIST_BACKEND_TEMPEDIT_FILESTITLE=Dateien Layout bearbeiten
JLIST_BACKEND_TEMPEDIT_SUMTITLE=Zusammenfassung Layout bearbeiten
