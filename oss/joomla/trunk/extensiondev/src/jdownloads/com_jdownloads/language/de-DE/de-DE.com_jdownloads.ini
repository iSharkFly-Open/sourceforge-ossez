#EDIT_LAYOUT_HEADER_TITLE=Layout für Kopfbereich
#EDIT_LAYOUT_HEADER_DESC=Hier kann die Darstellung der Komponente im Kopfbereich geändert werden.
#EDIT_LAYOUT_SUBHEADER_TITLE=Layout für Subheader
#EDIT_LAYOUT_SUBHEADER_DESC=Hier kann die Darstellung der Komponente unterhalb des Kofbereichs (Seitennavigation etc.) geändert werden.
#EDIT_LAYOUT_FOOTER_TITLE=Layout für Fußbereich
#EDIT_LAYOUT_FOOTER_DESC=Hier kann die Darstellung der Komponente am Seitenende geändert werden.

JLIST_RESTORE_OLD_FILE=FEHLER: Die ausgewählte Datei ist entweder keine Backupdatei oder von einer älteren Version! Die Wiederherstellung wurde abgebrochen.
JLIST_RUN_MONITORING_BUTTON_TEXT=Downloadbereich jetzt überprüfen
JLIST_RUN_MONITORING_TITLE=Downloadbereich überprüfen
JLIST_IF_MONITORING_ON_INFO=Hinweis: Ist die Anzahl der Dateien sehr hoch, wird empfohlen die automatische Überprüfung zu deaktivieren um zu lange Ladezeiten zu vermeiden. Die Überprüfung kann dann bei Bedarf hier manuell gestartet werden.
JLIST_RUN_MONITORING_INFO=(Die Überprüfung des Download Archivs kann einige Zeit in Anspruch nehmen. Dies ist abhängig von der Anzahl der vorhandenen Dateien und Kategorien.) 

JLIST_STOP_LEECHING_OPTION_TITLE=Downloads von fremden Websites unterbinden?
JLIST_STOP_LEECHING_OPTION_DESC=Wenn aktiviert, werden Fremdverlinkungen (Leeching) unterbunden. Beim Downloadversuch erhalten die Besucher der fremden Webseiten einen entsprechenden Hinweis.
JLIST_STOP_LEECHING_OPTION_NO_REFERER_TITLE=Auch blockieren wenn kein Referrer gesendet wird?
JLIST_STOP_LEECHING_OPTION_NO_REFERER_DESC=Wenn aktiviert, werden auch Downloadversuche von Besuchern unterbunden, bei deren Browsern die Übermittlung des Referrers deaktiviert wurde. In dem Fall ist nicht feststellbar, von welcher Website der Besucher kommt.
JLIST_STOP_LEECHING_ALLOWED_SITES_OPTION_TITLE=Erlaubte Websites
JLIST_STOP_LEECHING_ALLOWED_SITES_OPTION_DESC=Hier können Adressen von Webseiten eingetragen werden, denen die Fremdverlinkung erlaubt wurde. Die Webseiten müssen in diesem Format eingetragen werden (Beispiel): www.website.com. Mehrere Adressen müssen durch ein Komma (,) getrennt werden.
JLIST_FRONTEND_ANTILEECH_MESSAGE2=Sie haben versucht von einer fremden Webseite hier einen Download zu starten und dies wurde unterbunden<br />oder<br />Ihr Browser übermittelt keinen Referrer. In diesem Fall aktivieren Sie den Referrer in Ihrer Browserkonfiguration.     

JLIST_INSTALL_MOVE_IMAGES_CREATE_ROOT_DIR_ERROR=Es war nicht möglich das Unterverzeichnis: /jdownloads im Joomla Verzeichnis: /images zu erstellen! Prüfen Sie die CHMOD Zugriffsrechte und installieren Sie dann jD erneut.   

JLIST_AUTO_CAT_CHECK_ILLEGAL_NAME_FOUND_MSG=Neues Verzeichnis mit ungültigem Verzeichnisnamen gefunden! Daher war es nicht möglich dies dies hinzuzufügen. Bitte ändern Sie den Namen per FTP und starten Sie die Überprüfung erneut.

# NEW FRONTEND UPLOAD OPTIONS
JLIST_CONFIG_FEUPLOAD_DESC_OPTION=Hier können einige Datenfelder der Frontend Uploadform aktiviert/deaktiviert werden. Vom System benötigte Datenfelder sind hier nicht aufgeführt und können nicht deaktiviert werden. 
JLIST_CONFIG_FEUPLOAD_DESC_TITLE_HEAD=Datenfelder Optionen für Frontend Uploadformular
JLIST_CONFIG_FEUPLOAD_AUTHOR_NAME=Autor Feld anzeigen?
JLIST_CONFIG_FEUPLOAD_AUTHOR_URL=Autor Webadressen Feld anzeigen?
JLIST_CONFIG_FEUPLOAD_RELEASE_VIEW=Versions Feld anzeigen?
JLIST_CONFIG_FEUPLOAD_PRICE_VIEW=Preis Feld anzeigen?
JLIST_CONFIG_FEUPLOAD_LICENSE_VIEW=Lizenzen Feld anzeigen?
JLIST_CONFIG_FEUPLOAD_LANGUAGE_VIEW=Sprachen Feld anzeigen?
JLIST_CONFIG_FEUPLOAD_SYSTEM_VIEW=System Feld anzeigen?
JLIST_CONFIG_FEUPLOAD_LONG_DESC_VIEW=Feld für lange Beschreibung anzeigen?
JLIST_CONFIG_FEUPLOAD_FILE_PIC_VIEW=Feld für Bild hochladen anzeigen?
# NEW MP3 PLAYER OPTIONS
JLIST_BACKEND_SETTINGS_MEDIA_TAB_TITLE=Multimedia
JLIST_BACKEND_SETTINGS_MEDIA_TITLE=Multimedia Optionen
JLIST_BACKEND_SETTINGS_MP3_DESC1=jDownloads verwendet den MP3-Player von: <a href="http://flash-mp3-player.net">flash-mp3-player.net</a>.
JLIST_BACKEND_SETTINGS_MP3_DESC2=Hinweis: Wir geben nur Support für jDownloads, nicht für den MP3-Player (.swf Datei) selbst.
JLIST_BACKEND_SETTINGS_MP3_CONFIG_TITLE=MP3-Player Konfiguration
JLIST_BACKEND_SETTINGS_MP3_CONFIG_DESC=Hier kann das Layout (Farbe, Grösse, Schaltflächen etc.) des MP3-Player verändert werden. Zwischen jedem Parameter muss ein Semicolon (;) stehen.<br />Mehr Information und Beispiele, sind in der Documentation hier: <a href="http://flash-mp3-player.net/players/maxi/documentation">http://flash-mp3-player.net/players/maxi/documentation</a> zu finden.<br /><br />Um den Player zu verwenden, muss im verwendeten jDownloads Layout der Platzhalter<b>{mp3_player}</b> vorhanden sein!<br /><font color="#990000"><b>Vorsicht:</b> In dem Fall darf nicht der <b>.htaccess Schutz</b> (TAB: Sicherheitsrelevante Einstellungen) aktiviert werden.</font>   
JLIST_BACKEND_SETTINGS_MP3_CONFIG_VIEW_ID3_TITLE=MP3 Dateiinformation anzeigen
JLIST_BACKEND_SETTINGS_MP3_CONFIG_VIEW_ID3_DESC=Wenn aktiviert, werden MP3-Dateiinformation (ID3 Tags) angezeigt, wenn verfügbar. Hierzu muss der Platzhalter <b>{mp3_id3_tag}</b> im aktivierten Layout vorhanden sein! 
JLIST_BACKEND_SETTINGS_MP3_CONFIG_VIEW_ID3_LAY_TITLE=Layout für ID3 Tag Informationen
JLIST_BACKEND_SETTINGS_MP3_CONFIG_VIEW_ID3_LAY_DESC=Hier kann die Darstellung der Informationen angepasst werden.<br />Verfügbare Platzhalter (variablen): {album_title} {album} {name_title} {name} {year_title} {year} {artist_title} {artist} {genre_title} {genre} {length_title} {length}
JLIST_FE_VIEW_ID3_ALBUM=Album: 
JLIST_FE_VIEW_ID3_TITLE=Titel: 
JLIST_FE_VIEW_ID3_YEAR=Jahr: 
JLIST_FE_VIEW_ID3_ARTIST=Künstler: 
JLIST_FE_VIEW_ID3_GENRE=Genre: 
JLIST_FE_VIEW_ID3_LENGTH=Länge:
JLIST_FE_VIEW_ID3_MINS=min.

JLIST_BACKEND_SETTINGS_VIEW_DETAILSITE_TITLE=Download Detailseite anzeigen
JLIST_BACKEND_SETTINGS_VIEW_DETAILSITE_DESC=Wenn ja, enthält der Downloadtitel einen Link zur Detailseite der Datei mit mehr Informationen.  

JLIST_BACKEND_SETTINGS_USE_SRIPT_FOR_DOWNLOAD_TITLE=Download über PHP Script abwickeln?
JLIST_BACKEND_SETTINGS_USE_SRIPT_FOR_DOWNLOAD_DESC=Normalerweise verwendet jDownloads ein PHP Script um den Download abzuwickeln. Hierdurch wird auch der exakte Link zur Datei nicht übermittelt. Werden sehr große Dateien zum Download angeboten (mehrere hundert Megabyte), kann es aber dann zu Abbrüchen (Timeouts) kommen. Wenn Sie Option deaktivieren, wird der echte Downloadlink direkt zum Browser gesendet, der den Download dann abwickelt. <font color="#990000"><b>Vorsicht:</b> In dem Fall darf nicht der <b>.htaccess Schutz</b> (TAB: Sicherheitsrelevante Einstellungen) aktiviert werden.</font>

JLIST_BACKEND_SETTINGS_SEND_MAILTO_OPTION_UPLOAD_DESC=Wenn aktiviert, wird bei jedem Frontend Upload eine E-Mail an die unten angegebene Adresse gesendet. Hierzu muss in der Joomla Konfiguration die:<b> PHP Mail Funktion</b> aktiviert werden!
JLIST_BACKEND_SETTINGS_SEND_MAILTO_UPLOAD_DESC=E-Mail Adressen, an welche die Informationen über Uploads gesendet werden sollen. Mehrere Adressen mit einem Semikolon (;) getrennt werden. 

JLIST_UNINSTALL_MSG1=Verzeichnis /%s/ und alle Unterverzeichnisse wurden nicht gelöscht!
JLIST_UNINSTALL_MSG2=Verzeichnis images/jdownloads/ und alle Unterverzeichnisse wurden nicht gelöscht!
JLIST_UNINSTALL_MSG3=Alle von jDownloads erstellten Datenbank Tabellen wurden nicht gelöscht!
JLIST_UNINSTALL_MSG4=Werden diese nicht mehr benötigt, so müssen diese manuell gelöscht werden. Danke für den Einsatz von jDownloads!
JLIST_UNINSTALL_MSG5=Sie können nun aber auch ein neuere Version ohne Datenverlust installieren, falls verfügbar.<br />Vielen Dank für den Einsatz von jDownloads!

JLIST_EDIT_TEMPL_AMOUNT_COL_TITLE=Anzahl Spalten
JLIST_EDIT_TEMPL_AMOUNT_COL_DESC=Geben Sie hier die Anzahl Spalten (1-9) an. <b>Ändern Sie nur dann den Standardwert (1), wenn Sie das Layout entsprechend mehrspaltig aufbauen.</b> Schauen Sie sich hierzu das Beispiel Layout: <b>Beispiel mit 4 Spalten</b> an. Weitere Infos sind in der FAQ zu finden. 

# New standard layout with columns for categories view
JLIST_BACKEND_SETTINGS_TEMPLATES_CATS_COL_TITLE=Beispiel mit 4 Spalten
JLIST_BACKEND_SETTINGS_TEMPLATES_CATS_COL_DEFAULT={cat_title_begin}<div style="background-color:#EFEFEF; padding:6px;">{subcats_title_text}</div>{cat_title_end}\n{cat_info_begin}\n<table width="100%">\n<tr valign="top" border="0px">\n\n<td width="25%" style="padding:5px; text-align:center">{cat_pic1}<b><br />{cat_title1}</b><br />{sum_subcats1}<br />{sum_files_cat1}</td>\n<td width="25%" style="padding:5px; text-align:center">{cat_pic2}<b><br />{cat_title2}</b><br />{sum_subcats2}<br />{sum_files_cat2}</td>\n<td width="25%" style="padding:5px; text-align:center">{cat_pic3}<b><br />{cat_title3}</b><br />{sum_subcats3}<br />{sum_files_cat3}</td>\n<td width="25%" style="padding:5px; text-align:center">{cat_pic4}<b><br />{cat_title4}</b><br />{sum_subcats4}<br />{sum_files_cat4}</td>\n</tr></table>\n{cat_info_end}\n<table border="0" cellspacing="2" cellpadding="5" width="100%" style=" background: #ffffff;">\n{checkbox_top}\n</table>\n{files}\n{form_hidden}\n<div style="text-align:right">{form_button}</div>
JLIST_BACKEND_SETTINGS_TEMPLATES_CATS_COL_NOTE=Hier ist ein Beispiel für ein mehrspaltiges Layout. Wenn Sie eigene mehrspaltige Layouts erstellen möchten, so sind einige regeln zu beachten. Diese sind in der FAQ zu finden.

