# FOR MAIL AFTER FRONTEND UPLOADS
JLIST_SETTINGS_INSTALL_6=Informationen über einen Dateiupload!
JLIST_BACKEND_SETTINGS_GLOBAL_MAIL_UPLOAD_HEAD=E-Mail Konfiguration für Uploads
JLIST_BACKEND_SETTINGS_GLOBAL_MAIL_UPLOAD_TEMPLATE_TITLE=E-Mail Layout
JLIST_BACKEND_SETTINGS_GLOBAL_MAIL_UPLOAD_TEMPLATE_DESC=Hier können Sie die Darstellung der <b>E-Mail</b> festlegen, die (sofern aktiviert) nach jedem Upload an die oben festgelegte Adresse versendet wird. Es kann HTML-Code sowie beliebiger Text eingefügt werden.<br /><br />Verfügbare Platzhalter:<br />{name} {mail} {date} {ip} {file_title} {file_name} {description}
JLIST_BACKEND_SETTINGS_GLOBAL_MAIL_DOWNLOAD_TEMPLATE_DESC=Hier können Sie die Darstellung der <b>E-Mail</b> festlegen, die (sofern aktiviert) nach jedem Download an die oben festgelegte Adresse versendet wird. Es kann HTML-Code sowie beliebiger Text eingefügt werden.<br /><br />Verfügbare Platzhalter:<br />{file_list} {ip_address} {date_time} {user_name} {user_email} {user_group}    {user_email} added
JLIST_BACKEND_SETTINGS_GLOBAL_MAIL_UPLOAD_TEMPLATE=Mitteilung über eine Dateieinsendung!<br />\n<br />\nEinsender: {name}<br />\nE-Mail: {mail}<br />\nIP-Adresse: {ip}<br /><br />\nDateiname: {file_name}<br />\nTitel: {file_title}<br />\nBeschreibung: {description}<br />\nDatum und Zeit: {date}<br /><br />\nDies ist eine automatisch generierte E-Mail.

# NEW FOR "NEW" IMAGES
JLIST_BACKEND_SETTINGS_HOT_NEW_PIC_DESC2=Hier stehen alle Bilddateien aus dem Ordner: <b>../images/jdownloads/newimages </b>zur Auswahl. 

# FOR NEW OPTIONS: SCREENSHOT UPLOAD
JLIST_CONFIG_SETTINGS_THUMBS_TITLE=Größe der Vorschaubilder (Thumbnails) einstellen
JLIST_CONFIG_SETTINGS_THUMBS_INFO=Sollen Screenshots zu den Downloads verwendet werden, so werden nach dem Upload eines Bildes automatisch verkleinerte Kopien (Thumbnails) davon erstellt. Hier kann die Größe der Thumbnails eingestellt werden. Hinweis: Bedingung hierfür ist, das die GD Bibliothek auf dem Server installiert ist (siehe Status).
JLIST_CONFIG_SETTINGS_THUMBS_STATUS_GD_OK=Status: GD Library ist vorhanden!
JLIST_CONFIG_SETTINGS_THUMBS_STATUS_GD_NOT_OK=Status: GD Library ist nicht vorhanden!
JLIST_CONFIG_SETTINGS_THUMBS_SIZE_HEIGHT=Maximale Höhe in Pixel (z.B: 150).
JLIST_CONFIG_SETTINGS_THUMBS_SIZE_WIDTH=Maximale Breite in Pixel (z.B: 150).
JLIST_CONFIG_SETTINGS_THUMBS_CREATE_ALL_NEW_TITLE=Alle Thumbnails beim Speichern neu erstellen? 
JLIST_CONFIG_SETTINGS_THUMBS_CREATE_ALL_NEW_DESC=Löscht nach dem Speichern der Konfiguration alle aktuell vorhandenen Vorschaubilder (thumbnails) und erstellt diese mit den oben angegebenen Abmessungen neu.
JLIST_CONFIG_SETTINGS_THUMBS_CREATE_ALL_MESSAGE=Alle Vorschaubilder wurden neu erstellt! 

# NEW FIELDS IN EDIT FILES FOR SCREENSHOTS
JLIST_BACKEND_FILESEDIT_THUMBNAIL_LIST_NO_PIC=Kein Bild ausgewählt
JLIST_BACKEND_FILESEDIT_THUMBNAIL_LIST_TITLE=Bild vom Server auswählen:
JLIST_BACKEND_FILESEDIT_THUMBNAIL_LIST_DESC=Hier stehen alle verkleinerten Bilder im Ordner <b>/images/jdownloads/screenshots/thumbnails </b>zur Auswahl. Das aktivierte Bild kann dann über den Platzhalter {thumbnail} im Layout angezeigt werden.
JLIST_BACKEND_FILESEDIT_THUMBNAIL_UPLOAD_TITLE=Bild zum hochladen auswählen:
JLIST_BACKEND_FILESEDIT_THUMBNAIL_UPLOAD_DESC=Hier kann ein Bild zum Server hochgeladen werden. Dieses wird dann für diesen Download verwendet. Das Original wird im Ordner <b>/images/jdownloads/screenshots</b> gespeichert und automatisch eine verkleinerte Version (thumbnail) davon erstellt.

# FOR MIRROR LINK - JAVASCRIPT ERROR MESSAGE
JLIST_BACKEND_FILESEDIT_ERROR_ONLY_MIRROR=Fehler: Geben Sie zuerst eine interne oder externe Datei an. Ein Mirror Link ist nur zusätzlich möglich.

# FOR NEW MIRROR DOWNLOAD BUTTONS
JLIST_BACKEND_SETTINGS_DETAILS_MIRROR_BUTTON_TITLE1=1. Mirror Button 
JLIST_BACKEND_SETTINGS_DETAILS_MIRROR_BUTTON_TITLE2=2. Mirror Button 

# FOR NEW "UPDATED" ICON IN DOWNLOADS TITLE
JLIST_BACKEND_SETTINGS_HOT_NEW_PIC_DESC3=Hier stehen alle Bilddateien aus dem Ordner: <b>../images/jdownloads/updimages </b>zur Auswahl.
JLIST_BACKEND_SETTINGS_UPD_TITLE=Wie lange gilt ein Download als "aktualisiert"
JLIST_BACKEND_SETTINGS_UPD_DESC=Geben Sie hier die Anzahl Tage an, die ein Download als "aktualisiert" gelten soll. Hinter dem Download-Titel wird dann das unten angegebene Symbol angezeigt. Als aktualisiert gilt ein Download nur dann, wenn die entsprechende Option im Download aktiviert wurde. Bei 0 wird kein Symbol angezeigt. 

# FOR NEW OPTION - LOAD FILE IN BROWSER - NOT DOWNLOAD
JLIST_BACKEND_SETTINGS_FRONTEND_VIEW_FILE_TYPES=Welche Dateitypen sollen im Browser geöffnet werden
JLIST_BACKEND_SETTINGS_FRONTEND_VIEW_FILE_TYPES_DESC=Geben Sie hier die Dateitypen an, welche nicht als Download angeboten werden sollen. Diese werden in einem neuen Browserfenster zur Ansicht geöffnet. Zwischen jedem Wert muss ein Komma (,) stehen. Beispiel: html,htm,txt,pdf,doc,jpg,jpeg,png,gif

#NEW FRONTEND PIC UPLOAD FIELD
JLIST_FRONTEND_UPLOAD_PIC_FILETITLE=Screenshot:
JLIST_FRONTEND_UPLOAD_PIC_ALLOWED_FILES=Erlaubte Dateitypen:

# NEW FILTER OPTION IN FILES LIST - BACKEND
JLIST_BACKEND_FILESLIST_FILTER_PUBLISHED=Veröffentlichte
JLIST_BACKEND_FILESLIST_FILTER_UNPUBLISHED=Unveröffentlichte

# NEW INFO WHEN USING LIGHTBOX PLACEHOLDER
JLIST_BACKEND_TEMPEDIT_INFO_LIGHTBOX=Um die Screenshots mit der Lightbox Funktion anzuzeigen, müssen die Platzhalter in dieser Form verwendet werden:<br /><b><code>{screenshot_begin}&lt;a href="{screenshot}" rel="lightbox"&gt; &lt;img src="{thumbnail}" align="right" /&gt;&lt;/a&gt;{screenshot_end}</code></b>

# NEW OPTION FOR MANAGER ACCESS IN BACKEND
JLIST_BACKEND_SETTINGS_MANAGER_ACCESS=Zugriff für Manager?
JLIST_BACKEND_SETTINGS_MANAGER_ACCESS_DESC=Wenn ja, haben auch Mitglieder der Gruppe Manager Zugriff auf alle jDownloads Funktionen im Backend. Wenn Nein, nur Administratoren.

# NEW OPTION FOR VIEW PLACEHOLDER IMAGE FOR SCREENSHOTS IN DETAIL SITE
JLIST_BACKEND_SETTINGS_VIEW_PLACEHOLDER_TITLE=Screenshot Platzhalter in Detailseite anzeigen?
JLIST_BACKEND_SETTINGS_VIEW_PLACEHOLDER_TEXT=Wenn ja, wird bei Downloads denen kein Screenshot zugeordnet wurde, in der Detailansicht das links zu sehende Bild in der Layout Platzhalter Position angezeigt.

# NEW OPTION FOR VIEW PLACEHOLDER IMAGE FOR SCREENSHOTS IN FILESLIST
JLIST_BACKEND_SETTINGS_VIEW_PLACEHOLDER_IN_LIST_TITLE=Screenshot Platzhalter in Downloadlisten anzeigen?
JLIST_BACKEND_SETTINGS_VIEW_PLACEHOLDER_IN_LIST_TEXT=Wenn ja, wird bei Downloads denen kein Screenshot zugeordnet wurde, in den Downloadlisten das links oben zu sehende Bild in der Layout Platzhalter Position angezeigt.

# NEW OPTION FOR VIEW CATEGORY INFOS IN LISTVIEW - FRONTEND
JLIST_BACKEND_SETTINGS_CAT_VIEW_INFO_IN_LISTS_TITLE=Kategorie Informationen anzeigen?
JLIST_BACKEND_SETTINGS_CAT_VIEW_INFO_IN_LISTS_TEXT=Wenn ja, werden die Informationen der aktuell angezeigten Kategorie unterhalb der Navigationsleiste erneut angezeigt. Da der Name der Kategorie auch in der Navigationsleiste angezeigt wird, ist dies aber nicht immer erwünscht.<br />Hinweis: Bei Layouts mit mehr als einer Spalte hat diese Option keine Auswirkung.

# NEW OPTION FOR VIEW PAGE NAVIGATION ON THE BOTTOM - FRONTEND
JLIST_BACKEND_SETTINGS_VIEW_PAGENAVI_BOTTOM_TITLE=Seitennavigation unten anzeigen?
JLIST_BACKEND_SETTINGS_VIEW_PAGENAVI_BOTTOM_TEXT=Wenn ja, wird am Seitenende ebenfalls eine Seitennavigation angezeigt.

# NEW OPTION FOR VIEW PAGE NAVIGATION ON THE TOP - FRONTEND
JLIST_BACKEND_SETTINGS_VIEW_PAGENAVI_TOP_TITLE=Seitennavigation oben anzeigen?
JLIST_BACKEND_SETTINGS_VIEW_PAGENAVI_TOP_TEXT=Wenn ja, wird am Seitenanfang eine Seitennavigation angezeigt.

# PUBLISH FILES MESSAGE IN BACKEND
JLIST_BACKEND_EDIT_FILES_CAN_NOT_PUBLISH_INFO=Download(s) enthielten keine Dateizuordnung. Veröffentlichung so nicht möglich!

JLIST_BACKEND_EDIT_FILES_SET_UPDATE_TITLE=Download als aktualisiert markieren:
JLIST_BACKEND_EDIT_FILES_SET_UPDATE_TEXT=Wenn ja, wird in der Frontendansicht dieser Download als aktualisiert (Updated) optisch hervorgehoben. Die Dauer der Hervorhebung kann in der Konfiguration eingestellt werden.

# FOR NEW META INFORMATION FIELDS IN CAT AND FILES EDIT
JLIST_BACKEND_EDIT_METADESC_TITLE=Meta Beschreibung (meta-description):
JLIST_BACKEND_EDIT_METADESC_DESC=Optional kann hier eine kurze Beschreibung für das meta-description Feld erstellt werden. Diese werden dann in der HTML-Browserausgabe eingefügt.
JLIST_BACKEND_EDIT_METAKEY_TITLE=Meta Stichwörter (meta-keywords):
JLIST_BACKEND_EDIT_METAKEY_DESC=Optional können hier Stichwörter für das meta-keywords Feld erstellt werden. Diese werden dann in der HTML-Browserausgabe eingefügt.

JLIST_BACKEND_FILESEDIT_AUTHOR_INFOS_TITLE=Informationen zum Autor der Datei
JLIST_BACKEND_FILESEDIT_URL_HOME_DESC=URL zur Autoren Website. Diese wird im Frontend als Link angezeigt.
JLIST_BACKEND_FILESEDIT_AUTHOR_DESC=Wird hier ein Name eingegeben und unten eine Webadresse oder E-Mail, so wird dieser im Frontend als Link zur Website oder als E-Mail Link angezeigt.

# NEW PARAMETER IN SEARCH
JLIST_FRONTEND_SEARCH_NUMBERS=Anzahl Suchergebnisse

# NEW USER INFO BY EXTERN SHAREHOSTER LINK
JLIST_FRONTEND_DOWNLOAD_GO_TO_OTHER_SITE_INFO=Die angeforderte Datei befindet sich auf einer fremden Website.<br />Bitte folgen Sie den Hinweisen dort um den Download zu starten.

# NEW OPTION IN  EDIT DOWNLOADS
JLIST_BACKEND_FILESEDIT_OPEN_LINK_IN_OTHER_WEBSITE_TITLE=Download auf fremder Website
JLIST_BACKEND_FILESEDIT_OPEN_LINK_IN_OTHER_WEBSITE_DESC=Wenn Ja, liegt die Datei auf einer fremden Webseite (z.B. Sharehoster) und der Download kann nur von dieser fremden Seite gestartet werden! Der Mausklick auf den Download lädt dann diese Webseite im Browser.

# NEW SERVER INFO TAB IN CPANEL TAB
JLIST_BACKEND_PANEL_TABTEXT_5=Server Info
JLIST_BACKEND_SERVER_INFOS_TAB_TITLE=Informationen zur aktuellen Server Konfiguration 
JLIST_BACKEND_SERVER_INFOS_TAB_DESC=Die maximal zulässige Dateigröße für Uploads hängt von den Einstellungen der aktuellen Server Konfiguration (php.ini) ab. Unten sind die für Uploads relevanten aktuellen Werte zu sehen. Stellen Sie sicher, das die Werte ausreichend hoch sind. Sollten Sie selber keinen Zugriff auf die php.ini haben, wenden Sie sich an Ihren Hoster. Informationen zu den Parametern sind auf www.php.net zu finden. 
JLIST_BACKEND_SERVER_INFOS_TAB_FILE_UPLOADS=Datei-Upload erlaubt (file_uploads): 
JLIST_BACKEND_SERVER_INFOS_TAB_MAX_FILESIZE=Erlaubte Dateigröße (max_filesize): 
JLIST_BACKEND_SERVER_INFOS_TAB_POST_MAX_SIZE=Erlaubte POST Größe (post_max_size): 
JLIST_BACKEND_SERVER_INFOS_TAB_MEMORY_LIMIT=Speicherbeschränkung auf (memory_limit): 
JLIST_BACKEND_SERVER_INFOS_TAB_MAX_EXECUTION_TIME=Maximale Scriptlaufzeit (max_execution_time): 
JLIST_BACKEND_SERVER_INFOS_TAB_MAX_INPUT_TIME=Maximale Scriptlaufzeit für Uploads (max_input_time): 

# NEW MESSAGE AFTER EDIT CATEGORIES AND CHANGING THE ACCESS LEVEL
JLIST_BACKEND_CATSEDIT_SUM_CATS_ACCESS_LEVEL_CHANGED_AFTER_EDIT_MSG=Unterkategorien wurden auf die selben Zugriffsrechte gesetzt!
JLIST_BACKEND_CATSEDIT_CATS_ACCESS_LEVEL_CAN_NOT_CHANGED_MSG=Hinweis: Kategorien können keine niedrigeren Zugriffsrechte haben als die direkt Übergeordneten! Zugriffsrechte wurden daher zurückgesetzt.

