JLIST_BACKEND_SETTINGS_HOT_NEW_PIC_DESC=Hier stehen alle Bilddateien aus dem Ordner: <b>../images/jdownloads/hotimages </b>zur Auswahl. 
JLIST_BACKEND_SETTINGS_NEW_TITLE=Wie lange gilt ein Download als "neu"
JLIST_BACKEND_SETTINGS_NEW_DESC=Geben Sie hier die Anzahl Tage an, wie lange ein Download als "neu" gelten soll.  Hinter dem Download-Titel wird dann das unten angegebene Symbol angezeigt. Bei 0 wird kein Symbol angezeigt.

# NEW OPTION FOR DOWNLOAD PIC BUTTON IN DOWNLOAD DETAILS
JLIST_BACKEND_SETTINGS_DETAILS_DOWNLOAD_BUTTON_TITLE=Download Button  
JLIST_BACKEND_SETTINGS_DETAILS_DOWNLOAD_BUTTON_DESC=Hier stehen alle Bilddateien aus dem Ordner: <b>../images/jdownloads/downloadimages </b>zur Auswahl. Die aktivierten Buttons werden  auf der Download-Detailseite und die Zusammenfassung, für den Download- und die Mirror-Links verwendet. 

