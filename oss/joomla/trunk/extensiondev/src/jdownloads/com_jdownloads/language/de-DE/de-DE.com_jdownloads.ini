# ADDED IN v.1.6 stable
#*****************************
# NEW FOR RATING SYSTEM
JDVOTE_THANKS=Vielen Dank für die Bewertung!
JDVOTE_ALREADY_VOTE=Sie haben bereits für diesen Download abgestimmt!
JDVOTE_VOTES=Stimmen
JDVOTE_VOTE=Stimme
JDVOTE_UPDATING=Aktualisiere...
JDVOTE_STAR=Stern von
JDVOTE_STARS=Sterne von
# RATING CONFIG
JLIST_BACKEND_SETTINGS_RATING_ON_TITLE=Bewertungen aktivieren?
JLIST_BACKEND_SETTINGS_RATING_ON_DESC=Wenn ja, können Besucher Downloads bewerten. Hierzu muss zusätzlich der Platzhalter {rating} im aktivierten Layout vorhanden sein.
JLIST_BACKEND_SETTINGS_RATING_ONLY_REGGED_TITLE=Nur registrierte dürfen bewerten?
JLIST_BACKEND_SETTINGS_RATING_ONLY_REGGED_DESC=Wenn ja, können nur angemeldete Besucher Bewertungen abgeben.
# NOTE FOR TRANSLATORS:  
# please add in your translated file in JLIST_BACKEND_SETTINGS_TEMPLATES_FILES_DESC at (ca.) line 219 at the end: {rating} 
# please add in your translated file in JLIST_BACKEND_SETTINGS_TEMPLATES_DETAILS_DESC at (ca.) line 748 at the end: {rating} 