JLIST_BACKEND_SETTINGS_TEMPLATES_FILES_DESC2=Mit den Platzhaltern {files_title_begin} {files_title_text} {files_title_end} kann eine Titelzeile oberhalb der Dateiliste erstellt werden.   
# ADDITIONAL INFO IN CAT LAYOUT
JLIST_BACKEND_SETTINGS_TEMPLATES_CATS_DESC2=Mit den Platzhaltern {cat_title_begin} {subcats_title_text} {cat_title_end} kann eine Titelzeile oberhalb der Unterkategorien erstellt werden.   
JLIST_BACKEND_SETTINGS_TEMPLATES_CATS_DESC3=Die Platzhalter {cat_info_begin} und {cat_info_end} markieren den Bereich, der die Informationen zur Kategorie beinhaltet. In der Konfiguration kann dieser Bereich dann oberhalb der Datelisten ausgeblendet werden. 

