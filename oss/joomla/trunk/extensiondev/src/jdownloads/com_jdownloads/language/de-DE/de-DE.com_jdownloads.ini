JLIST_BACKEND_SETTINGS_FAUTO_ALL_FILES_DESC=Ist diese Option aktiviert, werden alle Dateien überwacht, unabhängig vom Dateityp!

# NEW OPTION  FOR AUTODETECT ONLY THIS FILES
JLIST_BACKEND_SETTINGS_FAUTO_ONLY_THIS_FILES_TITLE=Nur folgende Dateitypen überwachen:
JLIST_BACKEND_SETTINGS_FAUTO_ONLY_THIS_FILES_DESC=Wenn die obere Option deaktiviert ist, werden nur die hier aufgeführten Dateitypen überwacht! Zwischen jedem Wert muss ein Komma (,) stehen.

# NEW COPY DOWNLOADS FUNCTION
JLIST_BACKEND_FILES_COPY_TITLE=Downloads kopieren
JLIST_BACKEND_FILES_COPY_DESC=Wählen Sie die Kategorie aus, in der Kopien der ausgewählten Downloads erstellt werden sollen.
JLIST_BACKEND_FILES_COPY_TEXT_1=Folgende Downloads werden kopiert:
JLIST_BACKEND_FILES_COPY_TEXT_2=Hinweis: Wenn Sie die gleiche Kategorie als Ziel auswählen, wird darin eine "Kopie von <i>Downloadbezeichner</i>" angelegt!
JLIST_BACKEND_FILES_COPY_TEXT_3=Kopierte Downloads veröffentlichen:
