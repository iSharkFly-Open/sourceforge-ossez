# ADDED IN v.1.5.3 STABLE
#*******************************
JLIST_BACKEND_CATSEDIT_ERROR_FOLDER_NAME=FEHLER: Wenn Sie andere (nicht latienische Buchstaben verwenden wollen) müssen Sie zuvor die Option zur automatischen Erstellung der Verzeichnisnamen deaktivieren!

# NEW ALIAS FIELDS FOR FILES AND CATEGORIES
JLIST_EDIT_ALIAS_NAME_TITLE=Alias name
JLIST_EDIT_ALIAS_NAME_DESC=Der Alias Name wird verwendet wenn SEF aktiviert ist. jDownloads füllt dieses Feld automatisch aus. Es kann aber auch manuell angegeben werden. Es sind nur Kleinbuchstaben erlaubt. An Stelle von Leerstellen müssen Bindestriche verwendet werden ( - )! Enthält der Titel keine lateinischen Zeichen, so wird das Datum und die aktuelle Zeit verwendet.

# NEW FOR DELETE LOG
JLIST_BACKEND_DELETE_LOG_LINK_TEXT=Protokoll löschen

# NEW SORT ORDER FOR FILES
JLIST_BACKEND_SETTINGS_FILE_ORDER_6=Aktualisierte zuerst, dann nach Datum absteigend

