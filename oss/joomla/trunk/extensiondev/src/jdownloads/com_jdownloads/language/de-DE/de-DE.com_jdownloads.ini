# NEW OPTION EXTERN DOWNLOAD URL
JLIST_BACKEND_FILE_EDIT_EXT_DOWNLOAD_TITLE=Externer Dateilink:
JLIST_BACKEND_FILE_EDIT_EXT_DOWNLOAD_INFO=Soll hier eine externe Datei verlinkt werden, muss zuvor die Lokal zugewiesene Datei gelöscht werden.
JLIST_BACKEND_FILE_EDIT_EXT_DOWNLOAD_DESC=Hier können Sie eine externe Datei für diesen Download angeben. Lassen Sie dann das Eingabefeld für den Dateiupload oben leer.<br ><b>Wichtiger Hinweis:</b> Soll ein Link auf einen Sharehoster (z.B. Rapidshare) geleitet werden, so kann ein funktionierender Download nicht garantiert werden. Testen Sie dies also unbedingt zuvor. Auch kann die Dateigröße nicht immer ermittelt werden. Diese muss dann manuell eingetragen werden. 

#NEW OPTION FOR JCOMMENTS INTEGRATION
JLIST_BACKEND_SETTINGS_JCOMMENTS_TITLE=Kommentarfunktionen von JComments verwenden?
JLIST_BACKEND_SETTINGS_JCOMMENTS_DESC=Wenn Ja, wird die Kommentarfunktion von <b>JComments</b> in der Detailansicht der Downloads verwendet. <b>JComments</b> ist kein Bestandteil von jDownloads und muss hierzu separat installiert und konfiguriert werden. <br /><b>Status: Die Komponente ist noch nicht installiert!</b><br />Die Erweiterung ist auf <a href="http://www.joomlatune.com">www.joomlatune.com</a> zu finden.
JLIST_BACKEND_SETTINGS_JCOMMENTS_EXISTS_DESC=Wenn Ja, wird die Kommentarfunktion von <b>JComments</b> in der Detailansicht der Downloads verwendet. <br /><b>Status: JComments ist bereits installiert!</b>

