JLIST_BACKEND_SETTINGS_FILEPLUGIN_DEFAULTLAYOUT=Standard-Layout festlegen:
JLIST_BACKEND_SETTINGS_FILEPLUGIN_DEFAULTLAYOUT_DESC=Mit dem hier ausgewählten Layout werden die Downloads in den Artikeln angezeigt, wenn das Plugin <b>aktiviert</b> ist. (Siehe Parameter unten).
JLIST_BACKEND_SETTINGS_FILEPLUGIN_NOT_INSTALLED=Das Datei-Plugin für die Ansicht von Downloads innerhalb von Artikeln, ist kein fester Bestandteil von jDownloads und muss hierzu seperat installiert werden. <br /><b>Status: Das Artikel Plugin ist noch nicht installiert!</b><br />Die Erweiterung ist auf <a href="http://demo.joomlaaddons.de/index.php?option=com_jdownloads&Itemid=69&task=viewcategory&catid=9">www.JoomlaAddons.de</a> zu finden.
JLIST_BACKEND_SETTINGS_FILEPLUGIN_ONLINEPART=Parameter, Plugin aktiviert
JLIST_BACKEND_SETTINGS_FILEPLUGIN_OFFLINEPART=Parameter, Plugin deaktiviert
JLIST_BACKEND_SETTINGS_FILEPLUGIN_SHOWNEW=NEW-Symbol anzeigen
JLIST_BACKEND_SETTINGS_FILEPLUGIN_SHOWNEW_DESC=Anzeigen (oder nicht) des Symboles für neue Downloads.
JLIST_BACKEND_SETTINGS_FILEPLUGIN_SHOWHOT=HOT-Symbol anzeigen
JLIST_BACKEND_SETTINGS_FILEPLUGIN_SHOWHOT_DESC=Anzeigen (oder nicht) des Symboles für heisse Downloads (HOT-Symbol).
JLIST_BACKEND_SETTINGS_FILEPLUGIN_ENABLEPLUGIN=Plugin aktivieren
JLIST_BACKEND_SETTINGS_FILEPLUGIN_ENABLEPLUGIN_DESC=Aktivieren des Plugins. Dies hat nichts zu tun mit der Publikation des Plugins in Joomla. Falls das Plugin hier deaktiviert ist haben Sie die Möglichkeit den Besucher darüber zu informieren. (Siehe folgende Parameter)!
JLIST_BACKEND_SETTINGS_FILEPLUGIN_SHOWDISABLED=Meldung anzeigen wenn Plugin deaktiviert
JLIST_BACKEND_SETTINGS_FILEPLUGIN_SHOWDISABLED_DESC=Wenn das Plugin deaktiviert ist, können Sie den Besucher darüber informieren. (oder eben nicht). Siehe Parameter unten. <br \><b>Nein</b>: Nichts anzeigen.<br \><b>Defaultlayout</b>: Das Defaultlayout wird verwendet.<br \><b>Offlinelayout</b>: Das Offlinelayout wird verwendet.
JLIST_BACKEND_SETTINGS_FILEPLUGIN_DOWNLOADTITLE=Originaltitel des Downloads anzeigen (wenn Plugin deaktiviert)
JLIST_BACKEND_SETTINGS_FILEPLUGIN_DOWNLOADTITLE_DESC=Wenn <b>Ja</b> wird der Originaltitel (und das Symbol) des Downloads angezeigt, obwohl das Plugin deaktiverit ist.<br \>Wenn <b>Nein</b> wird der Titel des Downloads ersetzt durch den Inhalt des Feldes "Titel wenn Plugin deaktiviert" weiter unten.
JLIST_BACKEND_SETTINGS_FILEPLUGIN_OFFLINETITLE=Titel wenn Plugin deaktiviert
JLIST_BACKEND_SETTINGS_FILEPLUGIN_OFFLINETITLE_DESC=Ersatztitel wird angezeigt wenn die Option oben auf Ja steht.
JLIST_BACKEND_SETTINGS_FILEPLUGIN_OFFLINEDESC=Beschreibung wenn Plugin deaktiviert.
JLIST_BACKEND_SETTINGS_FILEPLUGIN_OFFLINEDESC_DESC=Diese Beschreibung wird anstelle der Original Downloadbeschreibung angezeigt wenn das Plugin deaktiviert ist..
JLIST_BACKEND_SETTINGS_FILEPLUGIN_SPECIALLAYOUT=Offlinelayout (wenn Plugin deaktiviert)
JLIST_BACKEND_SETTINGS_FILEPLUGIN_SPECIALLAYOUT_DESC=Das hier ausgewählte Layout wird verwendet wenn das Plugin deaktiviert ist.
JLIST_BACKEND_SETTINGS_FILEPLUGIN_SPECIALLAYOUT_OPT1=Nein
JLIST_BACKEND_SETTINGS_FILEPLUGIN_SPECIALLAYOUT_OPT2=Standard-Layout
JLIST_BACKEND_SETTINGS_FILEPLUGIN_SPECIALLAYOUT_OPT3=Offline-Layout
JLIST_FRONTEND_SETTINGS_FILEPLUGIN_OFFLINE_FILETITLE=Die Downloads sind deaktivert.
JLIST_FRONTEND_SETTINGS_FILEPLUGIN_DESCRIPTION=Falls Sie trotzdem die Erlaubnis haben die Dateien herunterzuladen, wollen Sie bitte den Webmaster informieren.
