JLIST_BACKEND_FILESEDIT_MIRROR_URL_DESC=Hier kann zusätzlich eine weitere externe Datei auf einem anderen Server angegeben werden (Mirror).<br />Bei Verwendung müssen im aktivierten Dateien- oder Details-Layout die Platzhalter {mirror_1} {mirror_2} eingefügt werden. Im übrigen gilt hier das gleiche für Sharehoster Dateien wie beim Feld: Externer Dateilink! 

