# NEW INSTALL MESSAGES FOR UPDATE
JLIST_INSTALL_WARNING_CAT_ACCESS_RIGHTS=Einige Kategorie Zugriffsrechte mussten korrigiert werden. Überprüfen Sie daher die Kategorien vor der Veröffentlichung!
JLIST_INSTALL_WARNING_DEFAULT_LAYOUTS_ARE_ACTIVE=Auf Grund neuer Platzhalter, wurden die neuen Standard Layouts v1.4 aktiviert! Dies kann in der Layout-Verwaltung geändert werden.

