JLIST_BACKEND_SETTINGS_FRONTEND_COMPO_TEXT_DESC=Optionaler Text der <b>zwischen</b> Komponententitel und den Kategorien angezeigt wird. Der Komponententitel kann oben in der ersten Option fetgelegt werden.<br /><br />Es können CSS-Klassen, HTML-Code sowie beliebiger Text eingefügt werden. Auch der Platzhalter {google_adsense} kann hier verwendet werden.

JLIST_BACKEND_SETTINGS_FRONTEND_CHECKBOX_TEXT=Checkbox Text
JLIST_BACKEND_SETTINGS_FRONTEND_CHECKBOX_TEXT_DESC=Texthinweis der neben der obersten Checkbox der Liste angezeigt werden soll.

