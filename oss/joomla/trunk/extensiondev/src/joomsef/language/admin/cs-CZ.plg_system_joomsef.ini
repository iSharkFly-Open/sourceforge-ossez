ENABLE METADATA GENERATION=Zapnout generování metadat
PREFER JOOMSEF TITLES=Upřednostnit titulky z JoomSEFu
USE SITENAME IN PAGE TITLES=Používat v titulcích stránek název webu
SITENAME SEPARATOR=Oddělovač pro název webu
REWRITE KEYWORDS=Přepisovat klíčová slova
REWRITE DESCRIPTION=Přepisovat popisek
PREVENT SITENAME DUPLICITY=Zabraňovat duplicitnímu názvu webu
SET PAGE BASE HREF VALUE=Nastavit hodnotu base href
YES - BEFORE PAGE TITLE=Ano - před titulkem stránky
YES - AFTER PAGE TITLE=Ano - za titulkem stránky
YES - ALWAYS USE ONLY BASE URL=Ano - používat kořenovou URL
YES - ALWAYS USE FULL SEO URL=Ano - používat plnou SEO URL
NO - LEAVE ORIGINAL=Ne - ponechat původní
