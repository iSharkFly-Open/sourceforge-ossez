# tooltips
TT_404_MESSAGE=Aseta Kyllä, jos haluat esittää myös standardit Joomlan viestit, kun 404 havaitaan
TT_404_PAGE=Esitä räätälöity 404-sivu, kun 404 Not Found -virhe havaitaan
TT_404_RECORD_HITS=Tallennetaanko 404-sivujen osumat tietokantaan? Jos tämä ei ole käytössä, vähentää se huomattavasti JoomSEF:n tekemien SQL-kyselyiden määrää, mutta tällöin et voi nähdä sivustoltasi poistettujen tai olemattomien sivujen lukukertoja. (Osumien laskemiseen voit käyttää Google Webmaster Toolsia)
TT_ADD_FILE=Tiedoston nimi, joka lisätään tyhjiin URL-osoitteisiin tai jos tiedostoa ei löydy. Hyödyllinen ominaisuus roboteille, jotka indeksoivat sivustoasia ja etsivät tiettyä tiedostoa, mutta joka palauttaa 404-sivun, koska tiedostoa ei ole olemassa.
TT_ALLOW_UTF=Jos asetettu kyllä, UTF-8-merkistöä voidaan käyttää URL-osoitteissa
TT_APPEND_NONSEF=Poistaa usein vaihtuvat muuttujat SEF URL -osoitteista ja lisää ne erikseen URL-osoitteen loppuun<br />Tämä valinta vähentää tietokantakyselyitä sekä estää duplikaatti-URL-osoitteiden syntymistä joillakin komponenteilla.
TT_ARTIO_DOWNLOAD_ID=Jos käytössäsi on maksullinen version Artio JoomSEFistä, syötä tähän lataus ID:si. Tämä tarvitaan, jotta automaattiset päivitykset löytäisivät sinulle oikean JoomSEF-version.
TT_ARTIO_USERNAME=Syötä tähän Artio-verkkosivusi käyttäjätunnus (vapaaehtoinen); tätä voidaan käyttää teknisen tuen yhteensovittamiseen ja nopeuttamiseen
TT_ARTIO_PASSWORD=Syötä tähän Artio-verkkosivusi salasana (vapaaehtoinen); tätä voidaan käyttää teknisen tuen yhteensovittamiseen ja nopeuttamiseen
TT_CACHE_HITS=Kuinka monta osumaa osoitteella pitää olla ennen kuin se tallennetaan välimuistiin.
TT_CACHE_SIZE=Kuinka monta URL-osoitetta voidaan tallentaa välimuistiin.
TT_CACHE_FILE_LOCK=Käytä käyttöjärjestelmän toteuttamaa tiedoston lukitusta, jos sinulla on ongelmia välimuistin kanssa, vaihda tämä Ei-tilaan, jolloin käytämme omaa algoritmiä
TT_CUSTOM_NONSEF=Lista kaikkialla käytettävistä räätälöidyistä ei-SEF-muuttujista puolipisteellä eroteltuna (muuttujat, jotka poistetaan SEF URL -osoitteista ja lisätään osoitteen perään)
TT_COMPONENT_DONT_SHOW_TITLE=Jos valittuna, valikon otsikkoa ei lisätä ollenkaan URL-osoitteeseen (paitsi suorat linkit komponenttiin)
TT_COMPONENT_HANDLING=<b>käytä vakiokäsittelijää</b><br/>vakiotoiminto, jossa käytämme edistynyttä SEF-laajennusta, jos se on käytettävissä <br/><b>ei välimuistia</b><br/>Osoitteita ei tallenneta tietokantaan ja käytämme vanhantyylisiä SEF-osoitteita <br/><b>ohita</b><br/>SEF-osoitteita ei tehdä tällä komponentille<br/>
TT_COMPONENT_TITLE=Ylikirjoittaa vakionavigaation otsikon (ensimmäisen osan SEF URL -osoitteesta) SEF URL -osoitteesta; jätä tyhjäksi, jos haluat käyttää vakiota
TT_DISABLE_NEW_SEF=Jos asetettu kyllä, uusia URL-osoitteita ei tallenneta tietokantaan, käytämme vain jo olemassa olevia.
TT_DONT_REMOVE_SID=Jos asetettu kyllä, sid-muuttujaa ei poisteta SEF URL -osoitteista. Tämä voi auttaa joitakin komponentteja toimimaan paremmin, mutta voi taas toisaalta luoda duplikaattiosoitteita toisiin.
TT_EXCLUDE_SOURCE= Tämä poistaa tiedot linkin lähteestä (Itemid) URL-osoitteesta.<br />Tämä voi estää duplikaattien URL-osoitteiden syntymistä, mutta samalla saattaa rajoitta Joomlan toimintoja. (katso lisää dokumentaatiosta)
TT_FILTER_NEW=Suodattaaksesi siirrettyjä osoitteita syötä osa URL:stä ja paina Enteriä.
TT_FILTER_OLD=Suodattaaksesi siirrettyjä osoitteita syötä osa URL:stä ja paina Enteriä.
TT_FILTER_REAL=Suodattaaksesi alkuperäisiä osoitteita syötä osa URL:stä ja paina Entteriä.<br/> Voit käyttää myös \'reg:\' etuliitettä suorittaaksesi regular expression -haun.
TT_FILTER_SEF=Suodattaaksesi alkuperäisi osoitteita SEF URL -osoitteen mukaan syötä osa URL:stä ja paina Enteriä.<br/> Voit käyttää myös \'reg:\' etuliitettä suorittaaksesi regular expression -haun.
TT_FRIEND_TRIM_CHAR=Merkit, jotka poistetaan URL-osoitteiden lopusta eroteltuna &quot;&#124;&quot;-merkillä
TT_CHECK_JUNK_URLS=Aktivoi suodattimen mahdollisesti vaarallisten muuttujien varalta.
TT_IGNORE_SOURCE=Jos asetettu Kyllä, jokaiselle sisältö sivulle tehdään vain yksi URL-osoite, vaikka useampi Itemid osoittaisi siihen (Ensimmäiseksi löydettyä Itemid:tä käytetään). Tämä on suositeltavaa, jotta vältämme duplikaatit osoitteet, mutta tallennettuja Itemid:tä saattaa joutua vaihtamaan, jos sivusto ei toimi odotusten mukaisesti (Katso lisätietoja dokumentaatiosta)
TT_ITEMID=URL-osoitteessa käyttävä navigaation Itemid (määrää, mitä moduuleja esitämme sivulla)
TT_JF_ALWAYS_USE_LANG=Lisää kielivalinta aina URL-osoitteeseen, jos ei asetettu, määrätään tämä automaattisesti
TT_JF_BROWSER_LANG=Jos asetettu Kyllä eikä kieltä ole valittuna erikseen, JoomSEF yrittää valita oikean kielen käyttäjälle hänen selaimensa asetusten perusteella
TT_JF_DOMAIN=Määrittele domain-nimi jokaiselle kielelle
TT_JF_LANG_COOKIE=Jos asetettu kyllä, JoomSEF tallentaa kielivalinnan evästeeseen
TT_JF_LANG_PLACEMENT=Mihin kohtaan kielen tunniste lisätään URL-osoitteisiin <b>älä lisää</b> tulisi käyttää vain, kun "sisällytä polkuun" on käytössä.
TT_JF_MAIN_LANG=Valitulle kielelle ei lisätä kielivalintaa URL-osoitteeseen
TT_JF_TRANSLATE=Käytä JoomFish-komponenttia kääntämään SEF URL -osoitteiden otsikot
TT_JOOMSEF_ENABLED=Jos asetettu Ei, käytetään Joomlan/Mambon vakio-SEF-ominaisuutta
TT_JUNK_EXCLUDE=Muuttujien nimet, jotka suodatetaan (puolipisteellä eroteltuna)
TT_JUNK_WORDS=Suodatettavat sanat SEF URL -osoitteista (välilyönnillä eroteltuna)
TT_HTACCESS_FROM=Suhteelliset uudelleenohjaukset Joomlan juurihakemistosta, vinoviivan <i>kanssa</i>.<br/><strong>Esimerkiksi:</strong><br/>/artioweb
TT_HTACCESS_TO=Absoluuttinen URL-osoitteen ohjaus<br/><strong>Esimerkiksi:</strong><br/>http://www.artio.net
TT_LOWERCASE=Muunna URL-osoitteista kaikki merkit pieniksi kirjaimiksi
TT_NONSEF_REDIRECT=Jos ei-SEF eli alkuperäinen URL-osoite syötetään selaimeen, uudelleenohjataanko käyttäjä vastaavaan SEF-osoitteeseen, siirretty pysyvästi headerilla?
TT_NUMBER_DUPLICATES=Jos asetettu Ei, duplikaatteja ei tallenneta ja duplikaattien hallintajärjestelmä yrittää valita parhaan käytettävän URL-osoitteen.
TT_ORIG_URL=Alkuperäinen URL-osoite ilman domainia, tämä URL-osoite pitää alkaa index.php:lla?
TT_PAGE_SEP_CHAR= Merkki, jota käytetään erottamaan sivunumero lopusta URL-osoitteesta
TT_PAGE_TEXT= Teksti, joka lisätään URL-osoitteeseen, jos sivuja on useampia. Käytä %s lisätäksesi sivunumero, vakiona tämä lisätään nimen loppuun. Jos pääte on valittuna, se lisätään aivan nimen loppuun.
TT_PARSE_JOOMLA_SEO=Jos asetettu Kyllä, JoomSEF yrittää ymmärtää standardeja Joomla SEO -linkkejä, tämä voi joissakin tapauksissa esittää 404-sivun virheellisesti.
TT_PREVENT_NONSEF_OVERWRITE=Jos asetettu Kyllä, ylimääräiset ei-SEF muuttujat, kuten id ja task, eivät ylikirjoita jo aikaisemmin tallennettuja SEF-linkkien muuttujia.
TT_REAPPEND_SOURCE=Tämä asetus uudelleenlisää Itemid:n SEF URL -osoitteisiin kyselyn parametrinä.
TT_REPLACE_CHAR=Merkit, joilla korvataan tuntemattomat merkit URL-osoitteista
TT_REPLACEMENTS=Määrittele, miten muut kuin ascii-merkit (tai merkijonot) korvataan<br />Formaatti on lähdeMerkkki1&#124;korvaavaMerkki1, lähdeMerkkki21&#124;korvaavaMerkkki2, ...<br />Huomioithan että näkymättömät merkit &quot;,&quot; ja &quot;\1&#124;&quot; välistä poistetaan.
TT_SEF_URL=SEF URL -osoite polkuna, suhteellinen sivuston juurihakemistoon ilman etummaista vinoviivaa.
TT_SELECT_ITEMID=Käytä valikon linkin valitsinta ja valitse kohde vastaavalla Itemid:llä
TT_SET_QUERY_STRING=Jos asetettu Kyllä, palvelimen QUERY_STRING asetetaan uusien muuttujien mukaan, tämä voi korjata joitakin uudelleenohjauksia komponenteissa, kuten VirtueMartissa.
TT_STRIP_CHAR=Poistettavat merkit URL-osoitteesta eroteltuna &quot;&#124;&quot;
TT_SUFFIX=Tiedostojen nimen pääte. Jätä tyhjäksi, jos et halua käyttää (suositeltavaa) tai käytä yleistä .html simuloidaksesi staattisia sivuja
TT_TRANSIT_SLASH=Sallimmeko molemmat URL-osoitteet, jotka loppuvat tai eivät lopu vinoviivaan?
TT_USE_404_ITEMID=Tulisiko Itemid-muuttuja asettaa, kun vakio 404-sivu esitetään?
TT_USE_ALIAS=Käytä otsikkoa ja otsikon aliasta URL-osoitteiden tekoon (toimii vain sisällössä, jossa aliakset ovat saatavilla)?
TT_USE_CACHE=Kun laitettu päälle, useimmiten käytetyt SEF URL -osoitteet tallennetaan välimuistiin, jolloin tietokantaan tehdään vähemmän kyselyitä.
TT_USE_MOVED=Kun SEF URL -osoite muuttuu, se tallennetaan uudelleenohjaustauluun, jolloin se toimii jatkossakin "siirretty pysyvästi header" -uudelleenohjauksella.
TT_USE_MOVED_ASK=Jos asetettu Ei, URL-osoitteiden uudelleenohjaukset luodaan automaattisesti aina, kun URL-osoite muuttuu, muutoin kysytään aina vahvistus.
TT_USE_SEC-CAT_INDEX=Jos asetettu Kyllä, vakio index-tiedosto lisätään kategoria- ja pääkategoria-linkkeihin

TRANSLATE URLS?=Käännä URL:ät?
