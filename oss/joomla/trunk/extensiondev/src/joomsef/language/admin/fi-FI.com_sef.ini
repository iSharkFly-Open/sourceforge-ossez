# info messages
INFO_ACCOUNT=Valinnainen. Voit syöttää tästä tunnuksesi tiedot Artio.net sivustolle, jos sinulla on ne käytössäsi. Tämä auttaa integroimaan komponentin paremmin tekniseen tukeen ja antamaan lisätietoja sinulle.<br/> Sivustoltasi ei lähetetä mitään muuta kuin ainoastaan tämän lomakkeen tiedot.
INFO_CONFIG_UPDATE=Välimuistin tyhjennys on suositeltavaa joka kerta, kun muutat välimuistin asetuksia tai muutat joitain räätälöityjä URL-osoitteita.
INFO_FOLLOW_SYMLINKS=Tässä voit ottaa käyttöön tai pois käytöstä FollowSymLinks-ominaisuuden. Käyttöönottaminen voi johtaa 501 Internal error -virheeseen, jos tämä ei ole sallittu palvelimen asetuksissa.<br/> Useimmat sivustot eivät edes käytä symbolisia linkkejä, joten yleensä tätä asetusta ei tarvita.
INFO_JOOMSEF_PLUGIN=Huomioithan, että JoomSEF-liitännäinen tulee olla asennettuna ja julkaistuna, jotta metatagi-ominaisuus toimisi (liitännäinen asennetaan yleensä JoomSEF-komponentin yhteydessä)<br /> Jos otsikon metatagi-generointi ei toimi, tarkista että se on sallittu Joomla-sivuston asetuksissa<br/> sekä että mikään muu liitännäinen ei ole ristiriidassa tämän kanssa.
INFO_HTACCESS_NOT_WRITABLE=.htaccess-tiedosto on kirjoitussuojattu tai sitä ei ole olemassa. Tarkista nämä tiedot ja yritä uudelleen.
INFO_SEF_DISABLED=HUOM: SEO-tuki ei ole Joomlassa päällä. Käyttääksesi SEO-ominaisuutta ota se ensin käyttöön %s Global Configuration% -sivulta.
INFO_SEF_REINSTALL=Päivityspaketti on samaa JoomSEF-versiota, joka on asennettuna. Päivittämisen sijasta on valittu uudelleenasennus.
INFO_SUPPORT_CHANNELS=Tukea on saatavilla seuraavista lähteistä:
INFO_REGISTRATION=Syötä lataus-ID, jos olet ostanut maksullisen version JoomSEF-komponentistä. ID:tä käytetään tunnistamaan asennukseni verkonkautta tapahtuvassa päivityksessä.
INFO_REWRITE_BASE=Voit ottaa käyttöön (suositeltavaa)/pois käytöstä RewriteBase-asetuksen. Tämä on <i>tärkeää</i> asettaa oikein, jotta JoomSEF toimisi oikein.<br/> &quot;/&quot; jos sivustosi sijaitsee domainin juuressa (esim. http://www.sitename.com) tai käyttää suhteellista polkua, esim. &quot;/joomlashop&quot; jos sivustosi sijaitsee alihakemistossa, (http://www.sitename.com/joomlashop).
INFO_UPGRADE_LICENSE_EXPIRED=Päivityslisenssisi on umpeutunut. Voit uudistaa sen tekemällä uuden tilauksen.
INFO_YOU_GET_FREE_VERSION=Saat ei-maksullisen version JoomSEFistä, kun käynnistät JoomSEFin päivityksen Artion palvelimelta.

