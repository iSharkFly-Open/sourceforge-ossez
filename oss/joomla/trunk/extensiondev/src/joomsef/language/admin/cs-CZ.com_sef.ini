WARNING_HTACCESS_EDIT=Upozornění! Toto je potenciálně nebezpečná činnost, nesprávnou editací .htaccess souboru můžete své stránky učinit nepřístupnými!
WARNING_PLUGIN_NOT_INSTALLED=Zásuvný modul JoomSEFu není nainstalován. Prosím nainstalujte jej ručně z následující složky
WARNING_PLUGIN_NOT_UNINSTALLED=Zásuvný modul JoomSEFu se nepodařilo odinstalovat. Prosím, odstraňte jej ručně.

WARNING!!!<BR/>YOU ARE ABOUT TO DELETE=UPOZORNĚNÍ!!!<br/>Chystáte se odstranit
WARNINSTALLFILE=Zvolený soubor není platný instalační soubor.
WARNINSTALLUPLOADERROR=Během aktualizace došlo k chybě.
WARNINSTALLZLIB=Chybí knihovna pro zpracování archivů ZIP.
WRITEABLE=zapisovatelný
YOU ARE NOT ALLOWED TO UPGRADE THIS EXTENSION.=Nemáte oprávnění aktualizovat tuto komponentu.
