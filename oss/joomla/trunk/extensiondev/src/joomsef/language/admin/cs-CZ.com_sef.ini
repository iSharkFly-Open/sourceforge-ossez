# info messages
INFO_ACCOUNT=Volitelné. Zde můžete zadat informace o svém uživatelském účtu na serveru ARTIO, máte-li jej. Údaje mohou být využity pro zlepšení služeb technické podpory nebo poskytování relevatních informací.<br />Z vašich stránek nejsou kromě údajů na tomto formuláři odesílány žádné informace.
INFO_CONFIG_UPDATE=Zvažte, zda změny provedené v konfiguraci vyžadují promazání již existujících URL adres.
INFO_FOLLOW_SYMLINKS=Zde můžete aktivovat či deaktivovat direktivu FollowSymLinks. Aktivace může způsobit chybu 500 Internal error, jestliže její použití není povoleno v hlavní konfiguraci web-serveru.<br />Pro většinu webů, které nevyužívají symbolické linky není aktivace této direktivy potřebná.
INFO_HTACCESS_NOT_WRITABLE=Soubor .htaccess neexistuje nebo není zapisovatelný. Prosím, ověřte přístup k souboru .htaccess a akci opakujte.
INFO_JOOMSEF_PLUGIN=Aby bylo zpracování metadat funkční musí být nainstalován a publikován zásuvný modul JoomSEFu (instalován společně s JoomSEF).<br />Pro generování meta-tagu title je nutno mít jeho generování povoleno v Globálním nastavení Joomly.<br />Pokud generování metadat nepracuje správně, ujistěte se, že mezi instalovanými zásuvnými moduly neexistuje konflikt.
INFO_SEF_DISABLED=UPOZORNĚNÍ: Podpora SEF adres je v Joomle aktuálně neaktivní. Pro aktivaci podpory SEF URL, prosím změňte nastavení na stránce %sGlobalní Nastavení%s.
INFO_SEF_REINSTALL=Nahráli jste balík se stejnou verzí JoomSEF jako je aktuálně nainstalována, místo aktualizace byla provedena reinstalace
INFO_SUPPORT_CHANNELS=Odporná pomoc a technická podpora pro JoomSEF je dostupná následujícími kanály:
INFO_REGISTRATION=Jestliže máte zakoupenu placenou verzi JoomSEFu, zadejte zde své download ID. ID je používáno pro identifikaci vaší kopie při online aktualizacích. 
INFO_REWRITE_BASE=Zde můžete aktivovat (doporučeno) či deaktivovat nastavení direktivy RewriteBase a její hodnotu. Správné nastavení je <i>nezbytné</i> pro správnou funkčnost JoomSEFu.<br />Hodnotu nastavete na &quot;/&quot; je-li váš web v rootu domény (např. http://www.sitename.com) nebo použijte relativní cestu, např. &quot;/joomlashop&quot; je-li web umístěn v podsložce domény, (http://www.sitename.com/joomlashop).
INFO_UPGRADE_LICENSE_EXPIRED=Vaše licence pro aktualizace vypršela. Můžete ji obnovit novou objednávkou.
INFO_UPGRADE_NOT_ACTIVE=Aktualizace pro vaši objednávku dosud nebyly aktivovány.
INFO_YOU_GET_FREE_VERSION=V případě spuštění aktualizace ze serveru ARTIO obdržíte neplacenou verzi.

