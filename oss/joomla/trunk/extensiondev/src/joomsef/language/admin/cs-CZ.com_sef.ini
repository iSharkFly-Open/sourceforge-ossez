# tooltips
TT_404_MESSAGE=Zvolta hodnotu ANO, jestliže chcete, aby byla při chybě 404 zobrazeno i výchozí chybové hlášení Joomly
TT_404_PAGE=Zobrazovat vlastní upravenou stránku 404 když je detekována chyba 404 Stránka nenalezena?
TT_404_RECORD_HITS=Ukládat záznamy o zobrazení stránky 404 do databáze? Zakázáním se sníží počet SQL dotazů potřebných pro zobrazení stránky, ale nebude možno evidovat počty dotazů na neexistující stránky (pro stejnou funkčnost lze použít i Google Webmaster Tools)
TT_ADD_FILE=Název souboru který se použije za URL končící na /; užitečné pro boty kteří vždy hledají index soubor a vrací 404 pokud v adresáři neexistuje
TT_ALLOW_UTF=JE-li nastaveno na ANO, mohou být v URL používány znaky UTF-8
TT_APPEND_NONSEF=Odstraní často se měnící proměnné ze SEF URL a připojí je jako část ne-SEF query.<br />Tím se sníží pořet URL ukládaných do databáze a rovněž se zabrání duplicitám u něktrých extenzí
TT_ARTIO_DOWNLOAD_ID=Máte-li placenou verzi ARTIO JoomSEF, zde prosím zadejte Download ID, které Vám bylo zasláno. Tento údaj slouží k zajištění, že při online aktualizaci Vám bude poskytnuta správná verze komponenty
TT_ARTIO_USERNAME=Zadejte své uživatelské jméno ze stránek ARTIO (volitelné); může být využito pro technickou podporu a poskytování relevatních informací
TT_ARTIO_PASSWORD=Zadejte své heslo ze stránek ARTIO (volitelné); může být využito pro technickou podporu a poskytování relevatních informací
TT_CACHE_HITS=Po kolika použitích URL může být tato uložena do vyrovnávací paměti
TT_CACHE_SIZE=Kolik URL záznamů lze uložit do vyrovnávací paměti
TT_CACHE_FILE_LOCK=Používat standardní systém zamykání souborů operačního systému; pokud nastávají problémy s cache, deaktivujte tuto volbu, bude použit vlastní zamykací algoritmus
TT_COMPONENT_DONT_SHOW_TITLE=Je li zatrženo, nebude v SEF URL použit titulek příslušné položky menu (kromě přímého odkazu na komponentu)
TT_COMPONENT_HANDLING=<b>použít výchozí ovladač</b><br/>zpracovat standardně pomocí JoomSEFu, pokud existuje SEF rozšíření nebo sef_ext soubor, bude použit<br/><b>neukládat</b><br/>neukládat URL do databáze a použít standardní Joomla SEF zpracování<br/><b>přeskočit</b><br/nNevytvářet SEF URL a ponechat původní
TT_COMPONENT_TITLE=Přebít výchozí menu titulek (první část SEF URL) v SEF URL vlastním; pro standardní funkčnost ponechte prázdné
TT_CUSTOM_NONSEF=Seznam globálních ne-SEF proměnných oddělených středníkem (proměnné, které budou vyjmuty ze SEF URL a připojeny za ní)
TT_DISABLE_NEW_SEF=Je li nastaveno na ANO, nebudou generovány a ukládány nové SEF URL, pouze použivány již existující
TT_DONT_REMOVE_SID=Je-li nastaveno ANO, nebude ze SEF URL odstraňováno sid. To může pomoci některým komponentám ve správné funkčnosti, ale může způsobit duplicity
TT_EXCLUDE_SOURCE=Odstranit informaci o zdroji odkazu (Itemid) z URL.<br />Tato volba pomůže předejít duplicitním URL, ale může mít dopad na některé funkce Joomly (více informací v dokumentaci)
TT_FILTER_NEW=Chcete-li filtrovat URL podle cílové URL, zadejte libovolnou část do tohoto pole z stiskněte ENTER
TT_FILTER_OLD=Chcete-li filtrovat URL podle zdrojové URL, zadejte libovolnou část do tohoto pole z stiskněte ENTER
TT_FILTER_REAL=Chcete-li filtrovat URL podle původní URL, zadejte libovolnou část do tohoto pole z stiskněte ENTER.<br />Můžete použít prefix \'reg:\' pro aktivaci podpory regulárních výrazů.
TT_FILTER_SEF=Chcete-li filtrovat URL podle SEF verze URL, zadejte libovolnou část do tohoto pole z stiskněte ENTER.<br />Můžete použít prefix \'reg:\' pro aktivaci podpory regulárních výrazů.
TT_FRIEND_TRIM_CHAR=Znaky, které mají být ořezány pokud se vyskytnou na konci URL, oddělujte pomocí &quot;&#124;&quot;
TT_CHECK_JUNK_URLS=Aktivuje filtrování potenciálně nebezpečných hodnot proměnných
TT_IGNORE_SOURCE=Je-li nastaveno na ANO, bude pro každou stránku obsahu vygenerována právě jedna URL, i tehdy, odkazuje-li na ní více odkazů z různými hodnotami Itemid (bude použita první nalezená hodnota Itemid); doporučeno pro předcházení duplicitám, ale může vyžadovat úpravu uložené Itemid hodnoty při nechtěném chování (podronosti v dokumentaci)
TT_ITEMID=ID položky menu asociované s URL (podle tohoto ID se určují zobrazené moduly na stránce)
TT_JF_ALWAYS_USE_LANG=Vždy použít kód jazyka v URL; pokud není explicitně určen, bude odvozen
TT_JF_BROWSER_LANG=Je-li aktivní a není-li explicitně určen jazyk, pokusí se JoomSEF zjistit aktuální jazyk z nastavení prohlížeče
TT_JF_DOMAIN=Definuje různé domény pro jednotlivé jazyky
TT_JF_LANG_COOKIE=Je-li aktivní, ukládá JoomSEF aktuální jazykové nastavení do cookie
TT_JF_LANG_PLACEMENT=Jak nakládat s informací o jazyce příslušné URL. Volba <b>nepřidávat</b> by mělo být použita pouze je-li aktivní překlad URL titulků
TT_JF_MAIN_LANG=Pro zvolený jazyk nebude k URL připojen jeho kód
TT_JF_TRANSLATE=Požívat JoomFish k překladu titulků SEF URL
TT_JOOMSEF_ENABLED=Je JoomSEF povolen? Pokud je nastaveno na NE, bude použit výchozí SEF engine Joomly
TT_JUNK_EXCLUDE=Jména proměnných, ve kterých se filtrování nebude provádět, oddělené středníkem
TT_JUNK_WORDS=Slova která mají být odfiltrována z proměnný v SEF URL, oddělená mezerou
TT_HTACCESS_FROM=Relativní přesměrování vzhledem ke kořenové složce <i>začínající</i> lomítkem.<br/><strong>Příklad:</strong><br/>/artioweb
TT_HTACCESS_TO=Absolutní URL na níž má být uživalel přesměrován.<br/><strong>Příklad:</strong><br/>http://www.artio.net
TT_LOWERCASE=Převádět všechny znaky v URL na malá písmena
TT_NONSEF_REDIRECT=Je-li do prohlížeče zadána ne-SEF URL, má být přesměrována na svůj SEF ekvivalent s hlavičkou Permanently Moved?
TT_NUMBER_DUPLICATES=Je-li nastaveno na NE, nebudou se duplicity ukládat a JoomSEF se pokusí zvolit nejvhodnější URL.
TT_ORIG_URL=Původní ne-SEF URL Joomly bez domény, musí začínat na index.php?
TT_PAGE_SEP_CHAR=Znak pro oddělení čísla stránek při stránkování od zbytku URL
TT_PAGE_TEXT=Text připojovaný k URL při stránkování. Pro umístění čísla použijte zástupný text %s; není-li uveden připojí se automaticky na konec. Je-li definována přípona URL, bude připojena za tento text
TT_PARSE_JOOMLA_SEO=Při nastavení na ANO se JoomSEF pokouší zpracovat standardní odkazy Joomla SEO, které mohou v některých případech chybně vést k chybě 404
TT_PREVENT_NONSEF_OVERWRITE=Je-li hodnota ANO, bude zajištěno, že případné ne-SEF proměnné z URL jako např. id či task nepřebijí hodnoty získané z uložené SEF URL
TT_REAPPEND_SOURCE=Připojit hodnotu Itemid k SEF URL jako query parametr
TT_REPLACE_CHAR=Znak kterým budou nahrazovány neznámé znaky nalezené v URL
TT_REPLACEMENTS=Definice jak mají být nahrazovány ne-ascii znaky (nebo řetězce).<br />Formát je zdroj1&#124;náhrada1, zdroj2&#124;náhrada2, ...<br />Prosím, vezměte na vědomí, že prázdné znaky okolo oddělovačů &quot;,&quot; a &quot;&#124;&quot; budou ořezány
TT_SELECT_ITEMID=Zvolte ze seznamu položku menu, jejíž Itemid má být použito při zobrazení stránky 404
TT_SEF_URL=SEF URL jako cesta, relativně ke kořenu domény bez úvodního lomítka
TT_SET_QUERY_STRING=Je-li nastaveno na ANO, bude proměnná QUERY_STRING nastavena podle proměnných po překladu SEF URL. Řeší potíže s některými komponentami, jako např. VirtueMart
TT_STRIP_CHAR=Znaky, které mají být z URL odstraňeny, oddělujte pomocí &quot;&#124;&quot;
TT_SUFFIX=Přípona pro simulaci souborů. Můžete ponechat prázdné (doporučeno) nebo se používá .html pro simulaci statických stránek
TT_TRACE=Je-li zapnuto sleduje se a ukládá, kde ve zdrojovém kódu byla URL vygenerovaná. Může poskytnout užitečné informace pro lazení problémů s neplatnými nebo nevhodnými URL.
TT_TRACE_DEPTH=Kolik funkčních volání zpětně sledovat? (výchozí hodnota je 3)
TT_TRANSIT_SLASH=Akceptovat URL s lomítkem na konci i bez jako platné?
TT_USE_404_ITEMID=Má se při zobrazení stránky 404 nastavit hodnota proměnné Itemid?
TT_USE_ALIAS=Vycházet při vytváření URL z titulků nebo jejich aliasů (u typu obsahu kde je alias dostupný)?
TT_USE_CACHE=Je-li aktivní, budou nejčastěji používané SEF URL uloženy ve vyrovnávací paměti, čímž se sníží počet dotazů do databáze
TT_USE_MOVED=Dojde-li ke změně SEF URL, bude uložena do tabulky přesměrování a zachována tak funkčnost pomocí hlavičky Permanently Moved
TT_USE_MOVED_ASK=Je-li nastaveno NE, bude při změně URL automaticky uloženo přesměrování; v opačném případě bude požadováno ověření
TT_USE_SEC-CAT_INDEX=Nastavte na ANO, pokud chcete aby byl u sekcí a kategorií připojován výchozí index soubor

TRANSLATE URLS?=Překládat URL?
TRIM FRIENDLY CHARACTERS=Znaky pro oříznutí
UNABLE TO EXECUTE SQL QUERY=Nepodařilo se spustit SQL dotaz
UNABLE TO FIND INSTALL PACKAGE.=Nepodařilo se najít instalační balík. Zkontrolujte práva a cestu dočasného adresáře.
UNABLE TO LOAD XML FILE.=Nepodařilo se načíst XML soubor.
UNABLE TO WRITE UPLOADED FILE TO TEMP DIRECTORY.=Nepodařilo se zapsat nahraný soubor do dočasného adresáře.
UNINSTALL=Odinstalovat
UNWRITEABLE=nezapisovatelný
UPDATE URLS=Aktualizovat URL
UPGRADE FROM ARTIO SERVER=Aktualizace se serveru ARTIO
UPGRADE MANAGER=Správce aktualizací
UPGRADE SOURCE NOT GIVEN.=Zdroj aktualizací nebyl určen.
UPGRADE=Aktualizovat
UPLOAD FILE=Nahrát soubor
UPLOAD PACKAGE FILE=Nahrát instalační balík
UPLOADS NOT ALLOWED.=Nahrávání souborů není povoleno.
URL SAVED=URL uložena
URL(S)=URL
URL=URL
URL SOURCE TRACING=Sledování zdroje URL
URLS MANAGEMENT=Správa URL
USE CACHE?=Používat vyrovnávací paměť?
USE DIFFERENT DOMAINS=používat různé domény
USE JOOMFISH TO TRANSLATE SEF URLS TITLES.=Používat JoomFish pro překlad titulků SEF URL.
USE INDEX FOR SECTIONS AND CATEGORIES=Používat index adresáře pro sekce a kategorie
USE ITEMID FOR DEFAULT 404 PAGE=Použít pro Výchozí stránku 404 Itemid
USE MOVED PERMANENTLY REDIRECTION TABLE?=Používat tabulku trvalých přesměrování?
USE STANDARD FILE LOCKING=Použít standardní zamykání souborů
USE TITLE OR ALIAS=Používat Titulek nebo Alias?
USING DEFAULT VALUES=Použít výchozí hodnoty
VALUE=Hodnota
VARIABLES FILTERING=Filtrování proměnných
VARIABLES TO EXCLUDE FROM FILTERING=Proměnné vyloučené z filtrování
VERSION=Verze
VERSION INFO=Informace o verzi
VIEW/EDIT=Zobrazit/Upravit
VIEWMODE=Způsob zobrazení

