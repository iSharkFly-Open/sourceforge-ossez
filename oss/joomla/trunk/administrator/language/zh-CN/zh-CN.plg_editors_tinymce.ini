PARAMCOLORS=显示 / 关闭  颜色控制按钮。只可用于扩展模式。
PARAMENTITYENCODING=控制 HTML 实体被编码。建议设置为 'raw'. 'named' = 使用命名来编码 (例如, '&lt;'). 'numeric' = 使用数字进行编码 (例如, '%03c'). raw = 不编码 HTML 实体。注意：如果你没有设置为原生方式，搜索引擎有时候可能不能找到到内容。
PARAMS EXTENDED MODE=<strong>扩展模式</strong><br /> 这些选择仅可用于只可用于扩展模式。
PARAMFONTS==显示 / 关闭  字体控制选择。只可用于扩展模式。
PARAMMEDIA==显示 / 关闭  媒体按钮。只可用于扩展模式。
PARAMPASTE=显示 / 关闭 粘贴按钮。只可用于扩展模式。
PASTE=粘贴
POSSIBILITY TO SEE INVISIBLE CHARACTERS=可以看到不可见的字符
RAW=行
