PARAMBLOCKQUOTE=Insert blockquote tags around the highlighted text.
PARAMCODECLEANUP=TinyMCE在默认情况下将会清除某些HTML元素中的代码，如script以及center标记，为安全起见及与XHTML兼容，建议您不要关闭这项功能。
PARAMCODECLEANUPONSAVE=建议设置为 'Always'. Never = 在保持的时候不清除代码。Front End = 当从头到尾进行编辑的时，在保持时候清理代码。 Always = Cleanup on save when editing from front and back end.
PARAMCOMPRESSEDVERSION=TinyMCE能够运行于压缩模式下以获得较快的载入速度。但是，这模式不一定总能正常工作，尤其是在IE里，因此默认情况下该模式是未启用的。当需要启用时必须谨慎。
PARAMCUSTOMCSS=您能够指定载入一份自定义的CSS文件——只要简单地输入完整的网址路径来链接到您想要载入的CSS文件。假如您在此区域输入了参数值，则将会取代正在使用的模板的CSS类中的参数值。
PARAMDIRECTIONALITY=选择是否显示RTL按钮——仅在高级模式下有效
PARAMELEMENTPATH=如果设置为开启，则将显示为所标记的文本设置的CSS类。
PARAMENTITIECLEANUP=如果设置为“关闭”（或“否”），则字元将从代码中分离出来。
PARAMEXTVALIDELEMENTS=允许往已存在的规则集中添加特定的有效HTML元素（valid_elements）。
PARAMFLASH=显示或隐藏Flash按钮——仅在高级模式下起作用
PARAMFULLSCREEN=显示或隐藏全幕按钮——仅在高级模式下起作用
PARAMINSERTDATE=显示或隐藏插入日期的按钮——仅在高级模式下起作用
PARAMINSERTTIME=显示或隐藏插入时间的按钮——仅在高级模式下起作用
PARAMHTMLHEIGHT=显示或隐藏HTML模式弹出窗口的高度——仅在高级模式下起作用
PARAMHTMLWIDTH=HTML模式弹出窗口的宽度——仅在高级模式下起作用
PARAMLAYER=显示或隐藏图层按钮——仅在高级模式下起作用
PARAMPREVIEW=显示或隐藏预览按钮——仅在高级模式下起作用
PARAMPREVIEWHEIGHT=预览弹出窗口的高度——仅在高级模式下起作用
PARAMPREVIEWWIDTH=预览弹出窗口的宽度——仅在高级模式下起作用
PARAMSEARCHREPLACE=显示或隐藏“搜索及替换”按钮——仅在高级模式下起作用
PARAMSMILIES=显示或隐藏表情图标按钮——仅在高级模式下起作用
PARAMSTYLE=显示或隐藏CSS风格控制按钮——仅在高级模式下起作用
PARAMTABLE=显示或隐藏表格控制按钮——仅在高级模式下起作用
PARAMTEMPLATE=显示或隐藏增添层的按钮——仅在高级模式下起作用
PARAMTEMPLATECSS=默认情况下插件会搜索一个editor.css文件。假如它在默认的编辑器模板中无法找到该文件，它将会在系统模板目录中，加载editor.css文件。
PARAMXHTMLXTRAS=显示或隐藏额外的XHTML功能——仅在高级模式下起作用
