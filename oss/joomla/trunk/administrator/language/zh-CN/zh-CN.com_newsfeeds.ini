CATEGORY GROUP=分类
CATEGORY GROUP DESC=该页面显示聚合新闻的一个分类。
CATEGORY LIST - CATEGORY=分类列表 - 分类
CATEGORY LIST - SECTION=分类列表 - 单元
CHANGES TO NEWSFEED SAVED=已保存对聚合新闻所作的修改
DESCNEWITEMSLAST=新增条目默认添加在最后面，您可以在条目保存后更改排列顺序。
DESCRIPTION FOR PAGE=页面说明
DESCRIPTION TEXT=说明
EDIT NEWSFEED=编辑聚合新闻
FEED=聚合新闻
FEED DESCRIPTION=聚合新闻的说明
IMAGE ALIGN=图片对齐方式
INDIVIDUAL FEED GROUP=单个聚合新闻（聚合新闻源）
INDIVIDUAL FEED GROUP DESC=这个页面显示一个聚合新闻（聚合新闻源）。
ITEM DESCRIPTION=条目的说明
LEFT TO RIGHT DIRECTION=从左到右
LINK=链接
LINK COLUMN=链接栏
NAME COLUMN=名称栏
NEWS FEED=聚合新闻的名称
NEWSFEED=聚合新闻
