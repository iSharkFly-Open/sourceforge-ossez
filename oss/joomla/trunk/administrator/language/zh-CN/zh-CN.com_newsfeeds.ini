NUMBER OF ARTICLES=文章数量
PARAMARTICLES=显示或隐藏聚合新闻（聚合新闻源）中的文章数
PARAMCATDESC=显示或隐藏分类说明
PARAMCATSELECT=聚合新闻的一个分类（可选）
PARAMCATITEMS=显示或隐藏各个分类中的条目数量
PARAMFEEDDESC=显示或隐藏聚合新闻（RSS Feed）的说明
PARAMIMAGE=页面图片，图片需放置于/images/stories文件夹中。默认使用图片web_links.jpg，无图片则意味着不调用任何图片
PARAMITEMDESC=显示或隐藏条目的简介或引言
PARAMOTHERCAT=在目录式排版浏览页显示或隐藏分类列表
PARAMOTHERCATSECTION=在列表浏览页显示或隐藏分类列表
PARAMWORDCOUNT=允许您限制新闻简介的字数，如为数字0则显示所有文字简介
