DISPLAY FEED IN RTL DIRECTION=显示输入 FEED RTL 的方向
DISPLAY NEWS FEED TITLE=显示 feed 新闻标题
ENTER NUMBER OF RSS ITEMS TO DISPLAY=输入需要显示多少 RSS 条目
ENTER THE URL OF THE RSS/RDF FEED=输入 URL RSS/RDF feed
FEED DESCRIPTION=Feed 描述
FEED TITLE=Feed 标题
FEED URL=Feed URL
ITEM DESCRIPTION=条目描述
ITEMS=条目
MOD_FEED=mod feed
PARAMITEMDESC=显示个体描述或介绍文本的 RSS 条目
PARAMWORDCOUNT=允许您限制多少数量可看见， 0 不限制
RTL FEED=RTL feed
SHOW THE DESCRIPTION TEXT FOR THE WHOLE FEED=显示此 Feed 文本描述
SHOW THE IMAGE ASSOCIATED WITH THE WHOLE FEED=显示与 Feed 整体相关的图像
WORD COUNT=字统计
