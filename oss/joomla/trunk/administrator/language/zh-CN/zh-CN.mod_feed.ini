DISPLAY FEED IN RTL DIRECTION=在 RTL 描述中显示聚合新闻
DISPLAY NEWS FEED TITLE=显示新聚合新闻的标题
ENTER NUMBER OF RSS ITEMS TO DISPLAY=输入期望每一个聚合新闻源中显示的聚合新闻条目数量
ENTER THE URL OF THE RSS/RDF FEED=RSS/RDF 聚合新闻的 URL
ERROR LOADING FEED DATA=载入聚合新闻数据错误
FEED DESCRIPTION=显示聚合新闻描述
FEED TITLE=显示聚合新闻标题
FEED URL=聚合新闻地址
ITEM DESCRIPTION=显示聚合新闻描述
ITEMS=聚合新闻显示数量
MOD_FEED=聚合新闻模块
PARAMITEMDESC=在单一聚合新闻条目中显示描述或介绍
PARAMWORDCOUNT=允许你为每一条聚合新闻条目显示描述文本的数量。 0 将会显示所有的文本。
RTL FEED=RTL 聚合新闻
SHOW THE DESCRIPTION TEXT FOR THE WHOLE FEED=为所有的聚合新闻显示文本描述
SHOW THE IMAGE ASSOCIATED WITH THE WHOLE FEED=为所有的聚合新闻显示相关图
WORD COUNT=字数