ENABLE METADATA GENERATION=启用 Meta 内容生成器
PREFER JOOMSEF TITLES=优化 JoomSEF 标题
USE SITENAME IN PAGE TITLES=在网页标题中使用站点名称
SITENAME SEPARATOR=Sitename separator
REWRITE KEYWORDS=重写关键字
REWRITE DESCRIPTION=重写描述
PREVENT SITENAME DUPLICITY=Prevent sitename duplicity
SET PAGE BASE HREF VALUE=基于链接值设置页面
YES - BEFORE PAGE TITLE=是 - 在页面标题前
YES - AFTER PAGE TITLE=是 - 在页面标题后
YES - ALWAYS USE ONLY BASE URL=是 - 总是使用基准链接
YES - ALWAYS USE FULL SEO URL=是 - 总是使用完整的搜索引擎优化链接
NO - LEAVE ORIGINAL=否 - 不做修改
