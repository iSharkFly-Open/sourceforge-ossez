BLOGGER XML-RPC API=Blogger XML-RPC接口
EDIT POSTS=编辑已发布的文章
NEW POSTS=新建一篇文章
PARAMCATEGORY=设置放置新文章的分类至
PARAMSECTION=设置取回文章的单元来自
LOGIN FAILED=登录失败
POST CHECK FAILED=文章校验失败
POST STORE FAILED=文章存储失败
POST DELETE FAILED=文章删除失败
SORRY, NO SUCH POST=对不起，没有找到指定的文章
SORRY, POST IS ALREADY BEING EDITED=对不起， 文章已经被编辑过了。
NO POSTS AVAILABLE, OR AN ERROR HAS OCCURRED=没有可用的文章 ， 或者有错误发生。
METHOD NOT IMPLEMENTED=方法不能被实例化。
RETURNS A LIST OF WEBLOGS TO WHICH AN AUTHOR HAS POSTING PRIVILEGES.=返回博客列表，同时返回作者所具有的权限。
RETURNS INFORMATION ABOUT AN AUTHOR IN THE SYSTEM.=返回系统中指定作者的信息。
RETURNS INFORMATION ABOUT A SPECIFIC POST.=返回指定文章的信息。
RETURNS A LIST OF THE MOST RECENT POSTS IN THE SYSTEM.=返回系统中最新创建的文章列表。
CREATES A NEW POST, AND OPTIONALLY PUBLISHES IT.=创建一条新的文章，并且选择发布。
DELETES A POST.=删除一篇文章。
UPDATES THE INFORMATION ABOUT AN EXISTING POST.=更新已经存在文章的信息。
