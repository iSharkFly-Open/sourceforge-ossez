JA PURITY DESCRIPTION="JA Purity"主题由JoomlArt.com所设计: 高度易用、优雅且模板易于定制。
LOGO TYPE=Logo类型 
LOGO TYPE DESCRIPTION=如果您不想使用位于&lt;b&gt;templates/this template/images/logo.gif&lt;/b&gt;的logo图片，可以使用预格式化的文本。
IMAGE=图片
TEXT=文字
LOGO TEXT=Logo文字
LOGO TEXT DESCRIPTION=如果Logo类型为文字，请在这里填写您的logo文字，放空则使用您的站点名称。
SLOGAN=口号
SLOGAN DESCRIPTION=如果Logo类型为文字，口号将在Logo文字下显示
FONT SIZE=字号
FONT SIZE DESCRIPTION=网站缺省字号
TEMPLATE WIDTH=模板宽度
TEMPLATE WIDTH DESCRIPTION=模板显示宽度，若设为“自动”则使用可适应宽度。
AUTO=自动（自适应宽度）
NARROW SCREEN=窄屏
WIDE SCREEN=宽屏
SPECIFIED PERCENTAGE=使用百分比指定（可伸缩）
SPECIFIED PIXEL=使用像素指定
SPECIFIED WIDTH=指定宽度
SPECIFIED WIDTH DESCRIPTION=如果使用指定宽度（使用百分比或像素），在这里填写数字
HEADER THEMES=头部主题
HEADER THEMES DESCRIPTION=支持三种内置主题
BACKGROUND THEMES=背景主题
BACKGROUND THEMES DESCRIPTION=页面背景主题
PRIMARY ELEMENTS=主元素
PRIMARY ELEMENTS DESCRIPTION=页面主元素主题
HORIZONTAL NAVIGATION=水平导航
HORIZONTAL NAVIGATION DESCRIPTION=启用或禁用水平嵌入导航
DISABLE=禁用
USE EMBEDED NAVIGATION=使用嵌入导航
USE EXTERNAL MODULE=使用外部模块
MENU TYPE=菜单类型
MENU TYPE DESCRIPTION=菜单类型将在水平导航栏显示
HORIZONTAL NAVIGATION TYPE=水平导航类型。
SUCKERFISH MENU OR JAMOO MENU=使用Suckerfish菜单或JAMoo菜单。请根据模板描述里的说明启用内嵌的下拉导航条。
JAMOO MENU=JAMoo菜单
SUCKERFISH MENU=Suckerfish菜单
RIGHT MODULES COLLAPSIBLE FUNCTION=右栏模块折叠功能
RIGHT MODULES COLLAPSIBLE FUNCTION DESCRIPTION=启用或禁用右栏折叠功能
ENABLE=启用
DEFAULT STATUS=缺省状态
DEFAULT STATUS DESCRIPTION=缺省状态下，全部折叠或者全部展开
EXPAND ALL=全部展开
COLLAPSE ALL=全部叠起
EXCLUDE MODULES=例外模块
EXCLUDE MODULES DESCRIPTION=不使用折叠功能的模块ID（使用逗号隔开）
SHOW COMPONENT=显示组件
SHOW COMPONENT DESCRIPTION=显示或隐藏组件输出内容
