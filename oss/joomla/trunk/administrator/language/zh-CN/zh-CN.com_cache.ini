CACHE MANAGER - CLEAN CACHE ADMIN=缓存管理 - 清除缓存
CACHE MANAGER - PURGE CACHE ADMIN=缓存管理 - 清除过期缓存
PURGE EXPIRED=清除过期缓存
PURGE EXPIRED ITEMS=物理清除过期缓存
WARNING: THIS CAN BE RESOURCE INTENSIVE ON SITES WITH LARGE NUMBER OF ITEMS!=警告：本操作可能因为涉及大量数据处理而大量消耗服务器资源。
CLICK ON THE PURGE EXPIRED ICON IN THE TOOLBAR TO DELETE ALL EXPIRED CACHE FILES. NOTE: CACHE FILES THAT ARE STILL CURRENT WILL NOT BE DELETED.=单击工具栏上的 【清除过期缓存】 按钮来清除所有已过期的缓存文件。注意：当前正在使用的缓存文件将会被保留。<br/>
EXPIRED ITEMS HAVE BEEN PURGED=所有过期的缓存文件已被清除。
SUCCESS!=操作成功！
CACHE DIRECTORY IS UNWRITABLE=缓存目录的访问权限为不可写
CACHE DIRECTORY IS WRITABLE=缓存目录的访问权限为可写
NUM=#
CACHE GROUP=缓存组（CACHE GROUP）
NUMBER OF FILES=文件数
SIZE=大小
WRITABLE=可写
UNWRITABLE=不可写
