BONCKOLEN_DESC=<h1>USAGE INSTRUCTIONS</h1>The concept is simple. You want to add image galleries inside your articles (content items)! First set the "<b class="red">Root folder</b>" of all galleries in the plugin's settings. By default it's the "root" folder. Now create a new folder anywhere inside your root folder, for example call it <b>mygallery</b> and upload there all your images. Go ahead and create a new content item (or open an existing one) and simply insert <b class="red">{boncko}/mygallery/{/boncko}</b> or <b class="red">{boncko msg="title different from default" music="mymp3.mp3"}/mygallery/{/boncko}</b>, where you want your image gallery to appear inside your text. <a href='http://home.boncko.it/index.php?option=com_content&view=article&id=145:bonckolen-istuction-en&catid=52:docs&Itemid=106' target='doc' > Documentation </a>
